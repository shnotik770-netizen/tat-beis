<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>הזמנה אישית — ערב שותפות | חב"ד עפולה</title>
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a; --gold:#c8952e; --gold-light:#f2c869;
    --cream:#fdf8ee; --card:#ffffff; --border:#ecdfc0; --text:#2a2015; --muted:#7a6f57;
    --danger:#b91c1c; --success:#166534;
    --radius:18px; --shadow:0 4px 18px rgba(120,90,20,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;
    background:radial-gradient(circle at 50% 0%, #fff8e6, var(--cream) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  button{font-family:inherit;cursor:pointer}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:28px 18px 60px;display:flex;
    flex-direction:column;align-items:center}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:32px 26px;width:100%;text-align:center;border:1px solid var(--border)}
  .crest{font-size:38px;margin-bottom:6px}
  .brand{font-size:12.5px;letter-spacing:.5px;color:var(--gold);font-weight:700;text-transform:uppercase}
  .title{font-size:23px;font-weight:800;color:var(--navy);margin:8px 0 2px}
  .subtitle{font-size:13.5px;color:var(--muted);margin-bottom:18px}
  .divider{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0}
  .to-label{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .guest-name{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px}
  .guest-name-companion{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px}
  .invite-text{font-size:14px;line-height:1.9;color:var(--text);margin:14px 0}
  .seat-box{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  .seat-tile{background:#fff7e6;border:1.5px solid var(--gold-light);border-radius:12px;
    padding:10px 18px;min-width:110px}
  .seat-tile .lbl{font-size:11px;color:var(--muted);margin-bottom:3px}
  .seat-tile .val{font-size:18px;font-weight:800;color:var(--navy)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
    padding:14px 18px;font-weight:700;font-size:15px;width:100%;margin-bottom:10px}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-gold{background:var(--gold);color:#3a2a04}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
  .btn-ghost{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:6px}
  .status-pill{display:inline-block;border-radius:20px;padding:6px 16px;font-weight:700;font-size:13.5px;margin-bottom:14px}
  .status-pill.going{background:#dcfce7;color:var(--success)}
  .status-pill.notgoing{background:#fee2e2;color:var(--danger)}
  .status-pill.donate{background:#dbeafe;color:#1d4ed8}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
  .err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;border-radius:10px;padding:12px;font-size:13.5px}
  .spinner{padding:60px 0;text-align:center;color:var(--muted);font-size:13.5px}
  .footer-note{font-size:11.5px;color:var(--muted);margin-top:22px;text-align:center}
  .hero-img{width:100%;border-radius:var(--radius);box-shadow:var(--shadow);display:block;margin-bottom:14px}
  .hero-details{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);
    width:100%;padding:14px 18px;text-align:center;box-shadow:var(--shadow);margin:14px 0}
  .hero-tagline{font-size:14px;font-weight:700;color:var(--gold-light);margin-bottom:6px}
  .hero-meta{font-size:13px;opacity:.92;line-height:1.6}
  .jump-link{display:block;text-align:center;font-size:12.5px;color:var(--muted);text-decoration:underline;
    margin-bottom:14px}
</style>
</head>
<body>
<div id="app"><div class="spinner">טוען הזמנה…</div></div>

<script>
(function(){
  'use strict';
  var API = '/api/public/invite';
  var token = location.pathname.split('/').filter(Boolean).pop();
  var EVENT = {
    brandText: 'ערב שותפות · בית ספר חב"ד עפולה',
    messageText: 'הרינו מתכבדים להזמינך לערב שותפות מיוחד למען מוסדות חב"ד עפולה.\nנשמח לראותך ולשתף אותך בהמשך הדרך.',
    footerText: 'תודה שאתם חלק ממשפחת חב"ד עפולה 💛',
    tagline: 'הזמן שלנו להתאחד, לצמוח ולפרוץ קדימה',
    dateText: 'יום שלישי · כ"ו אלול · 8.9 · בשעה 20:30',
    location: 'אולמי האושר, עפולה'
  };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function nl2br(s){
    return esc(s).replace(/\n/g, '<br>');
  }

  function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
    return fetch(API + path, Object.assign({}, opts, {headers: headers})).then(function(res){
      return res.text().then(function(text){
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch(e){}
        if (!res.ok) throw new Error((data && data.error) || 'שגיאה');
        return data;
      });
    });
  }

  function companionNameLine(invite){
    if (!invite.companionName) return '';
    return '<div class="guest-name-companion">ו' + esc(invite.companionName) + '</div>';
  }

  function heroDetailsHtml(){
    return '<div class="hero-details">' +
      '<div class="hero-tagline">' + esc(EVENT.tagline) + '</div>' +
      '<div class="hero-meta">' + esc(EVENT.dateText) + '</div>' +
      '<div class="hero-meta">' + esc(EVENT.location) + '</div>' +
    '</div>';
  }

  function heroImageHtml(){
    return '<img src="/assets/save-the-date.jpg" alt="Save the Date" class="hero-img">';
  }

  function jumpLinkHtml(){
    return '<a href="#rsvp-block" class="jump-link">אישור הגעה ⬇</a>';
  }

  // קישור לאתר "הכוח לצמוח" — הסיפור המלא מאחורי בית החינוך, חמש שנות צמיחה
  function growthSiteHtml(){
    return '<div class="card" style="margin-top:14px">' +
      '<div style="font-size:14px;color:var(--muted);margin-bottom:10px">מעוניינים להכיר לעומק את הסיפור שמאחורי המוסד?</div>' +
      '<a class="btn" href="https://tzmicha-site-production.up.railway.app/" target="_blank" rel="noopener" style="text-decoration:none;width:100%;background:linear-gradient(135deg,#2e9e5b,#1a7a63);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(30,140,90,.35)">🌱 להכיר לעומק את נושא הצמיחה</a>' +
    '</div>';
  }

  function seatBox(invite){
    if (!invite.seatNumber && !invite.companionSeatNumber) return '';
    var tiles = '';
    if (invite.seatNumber) tiles += '<div class="seat-tile"><div class="lbl">מקום הישיבה שלך</div><div class="val">' + esc(invite.seatNumber) + '</div></div>';
    if (invite.attendingWithCompanion && invite.companionSeatNumber) {
      tiles += '<div class="seat-tile"><div class="lbl">מקום לבן/בת הזוג</div><div class="val">' + esc(invite.companionSeatNumber) + '</div></div>';
    }
    return tiles ? '<div class="seat-box">' + tiles + '</div>' : '';
  }

  function renderConfirmed(invite){
    var app = document.getElementById('app');
    var pillClass = invite.status === 'מגיע לאירוע' ? 'going' : (invite.status === 'לא יכול להגיע אבל רוצה לתרום' ? 'donate' : 'notgoing');
    var companionLine = '';
    if (invite.status === 'מגיע לאירוע') {
      companionLine = '<div class="hint">' + (invite.attendingWithCompanion ? '👥 מגיע/ה עם בן/בת זוג' : '🧍 מגיע/ה לבד') + '</div>';
    }
    app.innerHTML =
      '<div class="card">' +
        '<div class="crest">🤝</div>' +
        '<div class="brand">' + nl2br(EVENT.brandText) + '</div>' +
        '<div class="to-label">לכבוד</div>' +
        '<div class="guest-name">' + esc(invite.greetingName || invite.name) + '</div>' +
        companionNameLine(invite) +
      '</div>' +
      heroDetailsHtml() +
      jumpLinkHtml() +
      heroImageHtml() +
      '<div class="card" id="rsvp-block">' +
        '<span class="status-pill ' + pillClass + '">' + esc(invite.status) + '</span>' +
        companionLine +
        seatBox(invite) +
        (invite.rsvpEnabled === false ? '' : '<button class="btn-ghost" id="change-btn">שינוי תשובה</button>') +
      '</div>' +
      growthSiteHtml() +
      '<div class="footer-note">' + nl2br(EVENT.footerText) + '</div>';
    if (invite.rsvpEnabled !== false) document.getElementById('change-btn').onclick = function(){ renderChoices(invite); };
  }

  function renderChoices(invite){
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="card">' +
        '<div class="crest">🤝</div>' +
        '<div class="brand">' + nl2br(EVENT.brandText) + '</div>' +
        '<div class="title">הזמנה אישית</div>' +
        '<div class="to-label">לכבוד</div>' +
        '<div class="guest-name">' + esc(invite.greetingName || invite.name) + '</div>' +
        companionNameLine(invite) +
      '</div>' +
      heroDetailsHtml() +
      jumpLinkHtml() +
      heroImageHtml() +
      '<div class="card" id="rsvp-block">' +
        '<div class="invite-text">' + nl2br(EVENT.messageText) + '</div>' +
        seatBox(invite) +
        '<hr class="divider">' +
        '<div id="rsvp-area"></div>' +
      '</div>' +
      growthSiteHtml() +
      '<div class="footer-note">' + nl2br(EVENT.footerText) + '</div>';

    if (invite.rsvpEnabled === false) {
      app.querySelector('#rsvp-area').innerHTML = '<div class="hint">אישורי הגעה ייפתחו בקרוב — נעדכן אתכם! 💛</div>';
      return;
    }
    renderMainQuestion();

    function renderMainQuestion(){
      var area = app.querySelector('#rsvp-area');
      area.innerHTML =
        '<button class="btn btn-gold" id="rsvp-yes">✅ מגיע/ה בשמחה</button>' +
        '<button class="btn btn-outline" id="rsvp-donate">🤝 לא יכול/ה להגיע, רוצה לתרום</button>' +
        '<button class="btn btn-outline" id="rsvp-no">😔 לא אוכל להגיע</button>';
      area.querySelector('#rsvp-yes').onclick = renderCompanionQuestion;
      area.querySelector('#rsvp-donate').onclick = function(){ submit('donate', false); };
      area.querySelector('#rsvp-no').onclick = function(){ submit(false, false); };
    }

    function renderCompanionQuestion(){
      var area = app.querySelector('#rsvp-area');
      area.innerHTML =
        '<div class="hint" style="margin-bottom:12px;font-size:13px">מגיע/ה לבד או עם בן/בת זוג?</div>' +
        '<button class="btn btn-primary" id="rsvp-alone">🧍 מגיע/ה לבד</button>' +
        '<button class="btn btn-gold" id="rsvp-plus" style="margin-bottom:14px">👥 מגיע/ה עם בן/בת זוג</button>' +
        '<button class="btn-ghost" id="rsvp-back">חזרה</button>';
      area.querySelector('#rsvp-alone').onclick = function(){ submit(true, false); };
      area.querySelector('#rsvp-plus').onclick = function(){ submit(true, true); };
      area.querySelector('#rsvp-back').onclick = renderMainQuestion;
    }

    function submit(attending, withCompanion){
      var area = app.querySelector('#rsvp-area');
      area.innerHTML = '<div class="spinner">שולח…</div>';
      api('/' + token + '/rsvp', {method:'POST', body: JSON.stringify({attending:attending, withCompanion:withCompanion})})
        .then(function(updated){ renderConfirmed(updated); })
        .catch(function(e){ area.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
    }
  }

  function loadEventSettings(){
    return fetch('/api/campaign-settings').then(function(r){ return r.json(); }).then(function(s){
      if (s.inviteBrandText) EVENT.brandText = s.inviteBrandText;
      if (s.inviteMessageText) EVENT.messageText = s.inviteMessageText;
      if (s.inviteFooterText) EVENT.footerText = s.inviteFooterText;
      if (s.eventTagline) EVENT.tagline = s.eventTagline;
      if (s.eventDateText) EVENT.dateText = s.eventDateText;
      if (s.eventLocation) EVENT.location = s.eventLocation;
    }).catch(function(){});
  }

  function boot(){
    if (!token){
      document.getElementById('app').innerHTML = '<div class="card"><div class="err">קישור לא תקין.</div></div>';
      return;
    }
    loadEventSettings().then(function(){
      return api('/' + token);
    }).then(function(invite){
      var RSVP_STATUSES = ['מגיע לאירוע', 'לא יכול להגיע לאירוע', 'לא יכול להגיע אבל רוצה לתרום'];
      if (invite.status && RSVP_STATUSES.indexOf(invite.status) > -1) renderConfirmed(invite);
      else renderChoices(invite);
    }).catch(function(e){
      document.getElementById('app').innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>';
    });
  }

  boot();
})();
</script>
</body>
</html>
