<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>גיוס שגרירים — ערב שותפות | חב"ד עפולה</title>
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a; --gold:#c8952e; --gold-light:#f2c869;
    --bg:#f4f5f7; --card:#ffffff; --border:#e3e6ea; --text:#1c2230; --muted:#6b7280;
    --danger:#dc2626; --success:#16a34a; --info:#2563eb; --warn:#d97706;
    --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding-bottom:76px}
  input,select,textarea,button{font-family:inherit;font-size:16px}
  button{cursor:pointer}
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

  /* ---- header ---- */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow)}
  .topbar h1{font-size:16px;margin:0;font-weight:700;line-height:1.3}
  .topbar .sub{font-size:12px;opacity:.75;margin-top:2px}
  .topbar .me{display:flex;align-items:center;gap:8px}
  .topbar .me button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:20px;
    padding:6px 12px;font-size:13px}
  .topbar .badge{background:var(--gold);color:#3a2a04;font-size:11px;font-weight:700;border-radius:20px;
    padding:2px 8px}

  /* ---- bottom nav ---- */
  .tabbar{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:640px;
    display:flex;background:#fff;border-top:1px solid var(--border);z-index:30;
    box-shadow:0 -2px 8px rgba(15,23,42,.06)}
  .tabbar button{flex:1;background:none;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;
    align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
  .tabbar button .ic{font-size:20px}
  .tabbar button.active{color:var(--navy)}
  .tabbar button.active .ic{filter:drop-shadow(0 0 0 var(--gold))}

  .content{padding:14px}

  /* ---- login ---- */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .login-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;
    width:100%;max-width:360px;text-align:center}
  .login-card .emoji{font-size:40px;margin-bottom:6px}
  .login-card h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
  .login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
  .field{text-align:right;margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);
    border-radius:10px;background:#fbfbfc;color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy)}
  .field textarea{resize:vertical;min-height:70px;font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;
    padding:11px 18px;font-weight:700;font-size:14px}
  .btn-primary{background:var(--navy);color:#fff;width:100%}
  .btn-gold{background:var(--gold);color:#3a2a04}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
  .btn-danger{background:#fff;border:1.5px solid var(--danger);color:var(--danger)}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.55}
  .err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;border-radius:8px;padding:9px 12px;
    font-size:13px;margin-bottom:12px;text-align:right}
  .ok-msg{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;border-radius:8px;padding:9px 12px;
    font-size:13px;margin-bottom:12px;text-align:right}

  /* ---- section headers / toolbar ---- */
  .sec-title{font-size:15px;font-weight:800;color:var(--navy);margin:2px 0 12px;display:flex;
    align-items:center;justify-content:space-between}
  .count-pill{background:#eef1f5;color:var(--muted);font-size:12px;border-radius:20px;padding:2px 10px;font-weight:600}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar select,.toolbar input{flex:1;min-width:110px;padding:9px 10px;border:1.5px solid var(--border);
    border-radius:9px;background:#fff;font-size:13px}

  /* ---- contact card ---- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;
    margin-bottom:10px;box-shadow:var(--shadow)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card-name{font-weight:800;font-size:15px;color:var(--navy)}
  .card-meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .card-meta a{color:var(--info);text-decoration:none}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .badge-cat{background:#eef1f5;color:#3a4356;font-size:11.5px;border-radius:20px;padding:3px 10px;font-weight:600}
  .badge-status{font-size:11.5px;border-radius:20px;padding:3px 10px;font-weight:700;color:#fff}
  .badge-amb{background:#fff7e6;color:#8a5a00;font-size:11.5px;border-radius:20px;padding:3px 10px;font-weight:600}
  .card-actions{display:flex;gap:8px;margin-top:10px}
  .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:13.5px}
  .empty .emoji{font-size:32px;display:block;margin-bottom:8px}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;
    align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;
    overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet-head h3{margin:0;font-size:16px;color:var(--navy)}
  .close-x{background:#f1f2f5;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;color:#555}
  .status-grid{display:flex;flex-direction:column;gap:8px;margin:8px 0 16px}
  .status-opt{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;text-align:right;
    background:#fff;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
  .status-opt.sel{border-color:var(--navy);background:#f5f6fb}
  .status-opt .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0}
  .timeline{display:flex;flex-direction:column;gap:0;margin-top:6px}
  .tl-item{display:flex;gap:10px;padding:6px 0;position:relative}
  .tl-item .tl-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .tl-item .tl-line{position:absolute;right:4px;top:16px;bottom:-6px;width:2px;background:var(--border)}
  .tl-body{font-size:13px}
  .tl-status{font-weight:700}
  .tl-meta{color:var(--muted);font-size:11.5px;margin-top:1px}
  .form-row2{display:flex;gap:10px}
  .form-row2 .field{flex:1}

  /* ---- admin ---- */
  .admin-tabs{display:flex;gap:6px;margin-bottom:14px;background:#eef1f5;border-radius:10px;padding:3px}
  .admin-tabs button{flex:1;background:none;border:none;border-radius:8px;padding:8px 4px;font-size:12.5px;
    font-weight:700;color:var(--muted)}
  .admin-tabs button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
  table.simple{width:100%;border-collapse:collapse;font-size:13px}
  table.simple th{text-align:right;color:var(--muted);font-size:11.5px;padding:4px 6px;border-bottom:1px solid var(--border)}
  table.simple td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
  .link-btn{background:none;border:none;color:var(--info);font-weight:700;font-size:12.5px;padding:2px}
  .link-btn.danger{color:var(--danger)}
  .import-result{font-size:12.5px;border-radius:8px;padding:6px 9px;margin-bottom:4px}
  .import-result.ok{background:#f0fdf4;color:var(--success)}
  .import-result.bad{background:#fef2f2;color:var(--danger)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
  .spinner{text-align:center;padding:30px;color:var(--muted);font-size:13px}

  /* ---- stats / charts ---- */
  .barchart{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:8px}
  .bar-label{width:88px;flex-shrink:0;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:14px;background:#eef1f5;border-radius:8px;overflow:hidden}
  .bar-fill{height:100%;border-radius:8px}
  .bar-value{width:26px;flex-shrink:0;text-align:left;font-size:12px;font-weight:700;color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  'use strict';

  var API = '/api';
  var STATUS_COLORS = {
    'שיחה ראשונית': '#64748b',
    'בודק': '#d97706',
    'מגיע לאירוע': '#16a34a',
    'לא יכול להגיע אבל רוצה לתרום': '#2563eb',
    'לא יכול להגיע לאירוע': '#dc2626'
  };

  // כל קטגוריה מקבלת צבע קבוע לפי ה-id שלה, כדי שאותה קטגוריה תיראה תמיד באותו צבע בכל האתר
  var CATEGORY_PALETTE = [
    {bg:'#e0edff', fg:'#1d4ed8'},
    {bg:'#dcfce7', fg:'#15803d'},
    {bg:'#f1e6fb', fg:'#7e22ce'},
    {bg:'#ffe9d6', fg:'#c2410c'},
    {bg:'#fde2ea', fg:'#be185d'},
    {bg:'#d9f5f0', fg:'#0f766e'},
    {bg:'#fef6d0', fg:'#a16207'},
    {bg:'#fde2e2', fg:'#b91c1c'},
    {bg:'#e3e2fd', fg:'#4338ca'},
    {bg:'#f5ead2', fg:'#92702a'}
  ];
  function categoryColor(cat){
    var raw = cat && cat.id;
    var n = 0;
    if (typeof raw === 'number') n = raw;
    else if (typeof raw === 'string') for (var i = 0; i < raw.length; i++) n += raw.charCodeAt(i);
    var idx = ((n % CATEGORY_PALETTE.length) + CATEGORY_PALETTE.length) % CATEGORY_PALETTE.length;
    return CATEGORY_PALETTE[idx];
  }

  var state = {
    me: null,
    tab: 'mine',
    adminTab: 'ambassadors',
    categories: [],
    statuses: [],
    ambassadors: [],
    busy: false
  };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
    if (state.me) headers['x-ambassador-id'] = state.me.id;
    return fetch(API + path, Object.assign({}, opts, {headers: headers}))
      .then(function(res){
        return res.text().then(function(text){
          var data = null;
          try { data = text ? JSON.parse(text) : null; } catch(e){}
          if (!res.ok) throw new Error((data && data.error) || 'שגיאת שרת');
          return data;
        });
      });
  }

  function setIdentity(amb){
    state.me = amb;
    if (amb) localStorage.setItem('gius_ambassador_id', String(amb.id)); else localStorage.removeItem('gius_ambassador_id');
  }

  // ממיר מספר יום (1–30) לאותיות עבריות (גימטריה), עם הכלל המקובל ט"ו/ט"ז במקום י"ה/י"ו
  function hebrewNumeral(n){
    if (n === 15) return 'טו';
    if (n === 16) return 'טז';
    var tens = ['', 'י', 'כ', 'ל'];
    var ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
    return (tens[Math.floor(n / 10)] || '') + (ones[n % 10] || '');
  }

  // ממיר שנה עברית מלאה (למשל 5786) לאותיות עם גרשיים, לפי המוסכמה (בלי האלפים — תשפ״ו ולא ה'תשפ״ו)
  function hebrewYear(n){
    var rem = n % 1000;
    var hundreds = ['', 'ק', 'ר', 'ש', 'ת', 'תק', 'תר', 'תש', 'תת', 'תתק'];
    var tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'];
    var ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
    var h = Math.floor(rem / 100);
    var last2 = rem % 100;
    var s = hundreds[h] || '';
    if (last2 === 15) s += 'טו';
    else if (last2 === 16) s += 'טז';
    else s += (tens[Math.floor(last2 / 10)] || '') + (ones[last2 % 10] || '');
    if (!s) return '';
    return s.length === 1 ? (s + '׳') : (s.slice(0, -1) + '״' + s.slice(-1));
  }

  function fmtHebrew(d){
    try {
      var parts = new Intl.DateTimeFormat('he-u-ca-hebrew', {day:'numeric', month:'long', year:'numeric'}).formatToParts(d);
      return parts.map(function(p){
        if (p.type === 'day') return hebrewNumeral(parseInt(p.value, 10));
        if (p.type === 'year') return hebrewYear(parseInt(p.value, 10));
        return p.value;
      }).join('');
    } catch(e){ return ''; }
  }

  function fmtDate(iso){
    if (!iso) return '';
    var d = new Date(iso);
    var heb = fmtHebrew(d);
    var time = d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
    return (heb ? heb + ' · ' : '') + d.toLocaleDateString('he-IL') + ' · ' + time;
  }

  // ===================== BOOT =====================
  // אין מסך התחברות — בוחרים "מי אני" מרשימת השגרירים הקיימת, וזה נשמר במכשיר
  function boot(){
    api('/ambassadors').then(function(ambs){
      state.ambassadors = ambs;
      var savedId = localStorage.getItem('gius_ambassador_id');
      var found = savedId && ambs.find(function(a){ return String(a.id) === savedId; });
      if (found){
        state.me = found;
        loadShared().then(renderApp);
      } else {
        renderPicker();
      }
    }).catch(function(e){
      document.getElementById('app').innerHTML = '<div class="content"><div class="err">' + esc(e.message) + '</div></div>';
    });
  }

  function loadShared(){
    return Promise.all([
      api('/categories').then(function(c){ state.categories = c; }).catch(function(){}),
      api('/statuses').then(function(s){ state.statuses = s; }).catch(function(){})
    ]);
  }

  // ===================== "מי אתה?" =====================
  function renderPicker(){
    var app = document.getElementById('app');
    var ambs = state.ambassadors;
    app.innerHTML =
      '<div class="login-wrap"><div class="login-card">' +
        '<div class="emoji">🤝</div>' +
        '<h2>ערב שותפות — בית ספר חב"ד עפולה</h2>' +
        '<p>מי אתה?</p>' +
        (ambs.length ? '<div class="field"><input id="pk-search" placeholder="חיפוש שם…"></div>' : '') +
        '<div id="pk-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px"></div>' +
        (!ambs.length ? '<div class="hint">עדיין אין שגרירים ברשימה.</div>' : '') +
        '<div class="hint">אם השם שלך לא מופיע — בקש מהמנהל להוסיף אותך ברשימת השגרירים.</div>' +
      '</div></div>';

    function draw(){
      var q = (app.querySelector('#pk-search') ? app.querySelector('#pk-search').value : '').trim().toLowerCase();
      var filtered = ambs.filter(function(a){ return !q || a.name.toLowerCase().indexOf(q) > -1; });
      var list = app.querySelector('#pk-list');
      list.innerHTML = filtered.map(function(a){
        return '<button class="btn btn-outline" data-pick="' + a.id + '" style="text-align:right;justify-content:space-between;display:flex">' +
          '<span>' + esc(a.name) + '</span>' + (a.isAdmin ? '<span class="badge" style="background:var(--gold);color:#3a2a04">מנהל</span>' : '') +
        '</button>';
      }).join('') || '<div class="hint">לא נמצאו שגרירים בשם הזה.</div>';
      Array.prototype.forEach.call(list.querySelectorAll('[data-pick]'), function(btn){
        btn.onclick = function(){
          var amb = ambs.find(function(a){ return String(a.id) === btn.getAttribute('data-pick'); });
          if (!amb.isAdmin){
            setIdentity(amb);
            loadShared().then(renderApp);
            return;
          }
          var pin = window.prompt('גישת מנהל — הזינו קוד גישה:');
          if (pin === null) return;
          api('/ambassadors/' + amb.id + '/verify-pin', {method:'POST', body: JSON.stringify({pin:pin})}).then(function(){
            setIdentity(amb);
            loadShared().then(renderApp);
          }).catch(function(e){ alert(e.message); });
        };
      });
    }
    if (app.querySelector('#pk-search')) app.querySelector('#pk-search').oninput = draw;
    draw();
  }

  function switchIdentity(){
    setIdentity(null);
    boot();
  }

  // ===================== APP SHELL =====================
  function renderApp(){
    var app = document.getElementById('app');
    var tabs = [
      {id:'mine', ic:'📋', label:'שלי'},
      {id:'unassigned', ic:'🕊️', label:'פתוחים'},
      {id:'all', ic:'📚', label:'הכל'},
      {id:'candidates', ic:'🌟', label:'מועמדים'},
      {id:'stats', ic:'📊', label:'סטטיסטיקה'},
      {id:'add', ic:'➕', label:'הוספה'}
    ];
    if (state.me.isAdmin) tabs.push({id:'admin', ic:'⚙️', label:'ניהול'});

    app.innerHTML =
      '<div class="topbar">' +
        '<div><h1>ערב שותפות — חב"ד עפולה</h1><div class="sub">שלום, ' + esc(state.me.name) + (state.me.isAdmin ? ' <span class="badge">מנהל</span>' : '') + ' · ' + esc(fmtHebrew(new Date())) + '</div></div>' +
        '<div class="me"><button id="switch-btn">🔄 החלף זהות</button></div>' +
      '</div>' +
      '<div class="content" id="content"></div>' +
      '<div class="tabbar" id="tabbar"></div>';

    document.getElementById('switch-btn').onclick = switchIdentity;

    var tabbar = document.getElementById('tabbar');
    tabbar.innerHTML = tabs.map(function(t){
      return '<button data-tab="' + t.id + '" class="' + (state.tab === t.id ? 'active' : '') + '">' +
        '<span class="ic">' + t.ic + '</span><span>' + t.label + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(tabbar.querySelectorAll('button'), function(btn){
      btn.onclick = function(){ state.tab = btn.getAttribute('data-tab'); renderApp(); };
    });

    var content = document.getElementById('content');
    content.innerHTML = '<div class="spinner">טוען…</div>';

    if (state.tab === 'mine') renderContactList(content, {scope:'mine', title:'הרשימה שלי', emptyMsg:'עדיין אין אנשים ברשימה שלך. אפשר להוסיף מהלשונית "הוספה".'});
    else if (state.tab === 'unassigned') renderContactList(content, {scope:'unassigned', title:'לא משויכים', emptyMsg:'כל הכבוד — אין כרגע אנשים שלא משויכים לשגריר.'});
    else if (state.tab === 'all') renderContactList(content, {scope:'all', title:'כל הרשימה', emptyMsg:'הרשימה ריקה.'});
    else if (state.tab === 'candidates') renderContactList(content, {scope:'candidates', title:'מועמדים לשגרירות', emptyMsg:'עדיין לא סומנו מועמדים לשגרירות. אפשר לסמן מתוך הכרטיס של כל איש קשר.'});
    else if (state.tab === 'stats') renderStats(content);
    else if (state.tab === 'add') renderAdd(content);
    else if (state.tab === 'admin') renderAdmin(content);
  }

  // ===================== CONTACT LIST (שלי / פתוחים / הכל / מועמדים) =====================
  // רכיב רשימה משותף לכל המסכים: חיפוש, מיון, סינון לפי קטגוריה/סטטוס/ללא-סיווג, ופעולות לפי הקשר
  function renderContactList(content, opts){
    Promise.all([
      api('/contacts?scope=' + opts.scope),
      (opts.scope === 'all' && state.me.isAdmin) ? api('/ambassadors').catch(function(){ return null; }) : Promise.resolve(null)
    ]).then(function(res){
      var contacts = res[0];
      var assignAmbs = res[1];
      var filters = {q:'', cat:'', status:'', amb:'', uncategorized:false, sort:'name'};
      var selected = {};

      function getFiltered(){
        var list = contacts.filter(function(c){
          if (filters.q){
            var q = filters.q.toLowerCase();
            var hit = (c.name && c.name.toLowerCase().indexOf(q) > -1) || (c.phone && c.phone.indexOf(q) > -1);
            if (!hit) return false;
          }
          if (filters.cat && !c.categories.some(function(x){ return x.name === filters.cat; })) return false;
          if (filters.status && c.status !== filters.status) return false;
          if (filters.amb === 'none' && c.ambassador) return false;
          if (filters.amb && filters.amb !== 'none' && (!c.ambassador || String(c.ambassador.id) !== filters.amb)) return false;
          if (filters.uncategorized && c.categories.length) return false;
          return true;
        });
        list.sort(function(a, b){
          if (filters.sort === 'name') return a.name.localeCompare(b.name, 'he');
          if (filters.sort === 'status') return (a.status || '').localeCompare(b.status || '', 'he');
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
        return list;
      }

      var cats = uniqueCats(contacts);
      content.innerHTML =
        '<div class="sec-title">' + opts.title + ' <span class="count-pill" id="count-pill">' + contacts.length + '</span></div>' +
        '<div class="toolbar">' +
          '<input id="f-q" placeholder="חיפוש שם / טלפון">' +
          '<select id="f-sort">' +
            '<option value="name">מיון: לפי שם (א-ת)</option>' +
            '<option value="newest">מיון: החדשים ביותר</option>' +
            '<option value="status">מיון: לפי סטטוס</option>' +
          '</select>' +
        '</div>' +
        '<div class="toolbar">' +
          '<select id="f-cat"><option value="">כל הקטגוריות</option>' +
            cats.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('') +
          '</select>' +
          '<select id="f-status"><option value="">כל הסטטוסים</option>' +
            state.statuses.map(function(s){ return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('') +
          '</select>' +
        '</div>' +
        (opts.scope === 'all' && state.me.isAdmin && assignAmbs ? (
          '<div class="toolbar">' +
            '<select id="f-amb"><option value="">כל השגרירים</option>' +
              '<option value="none">ללא שיוך</option>' +
              assignAmbs.map(function(a){ return '<option value="' + a.id + '">' + esc(a.name) + ' — ' + a.contactCount + ' אנשים</option>'; }).join('') +
            '</select>' +
          '</div>'
        ) : '') +
        '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:12px">' +
          '<input type="checkbox" id="f-uncat"> להציג רק אנשי קשר ללא סיווג</label>' +
        '<div id="bulk-bar" class="toolbar" style="display:none;align-items:center;background:#eef1f5;border-radius:10px;padding:8px 10px">' +
          '<span id="bulk-count" style="font-weight:700;font-size:12.5px;flex:0"></span>' +
          ((opts.scope === 'unassigned' || opts.scope === 'all') ? '<button class="btn btn-gold btn-sm" id="bulk-claim" style="flex:0">✋ קח לרשימה שלי</button>' : '') +
          ((opts.scope === 'mine' || opts.scope === 'unassigned' || opts.scope === 'all') ? '<button class="btn btn-outline btn-sm" id="bulk-status" style="flex:0">🔄 עדכון סטטוס</button>' : '') +
          '<button class="btn btn-outline btn-sm" id="bulk-cat" style="flex:0">🏷️ סיווג נבחרים</button>' +
          '<button class="btn btn-danger btn-sm" id="bulk-del" style="flex:0">🗑️ מחיקת נבחרים</button>' +
          '<button class="btn btn-outline btn-sm" id="bulk-clear" style="flex:0">ביטול</button>' +
        '</div>' +
        '<div id="list-body"></div>';

      function updateBulkBar(){
        var bar = content.querySelector('#bulk-bar');
        var count = Object.keys(selected).length;
        bar.style.display = count ? 'flex' : 'none';
        if (count) content.querySelector('#bulk-count').textContent = count + ' נבחרו';
      }

      if (content.querySelector('#bulk-claim')) content.querySelector('#bulk-claim').onclick = function(){
        var ids = Object.keys(selected);
        if (!ids.length) return;
        Promise.all(ids.map(function(id){
          return api('/contacts/' + id + '/claim', {method:'POST'})
            .then(function(updated){ return {id:id, ok:true, updated:updated}; })
            .catch(function(e){ return {id:id, ok:false, error:e.message}; });
        })).then(function(results){
          var claimedCount = 0, skippedCount = 0;
          results.forEach(function(r){
            if (r.ok){
              claimedCount++;
              var idx = contacts.findIndex(function(c){ return String(c.id) === r.id; });
              if (idx > -1) contacts[idx] = r.updated;
              delete selected[r.id];
            } else {
              skippedCount++;
            }
          });
          if (skippedCount) alert('נלקחו ' + claimedCount + ' אנשי קשר לרשימה שלך. ' + skippedCount + ' לא נלקחו (כבר משויכים לשגריר אחר).');
          draw();
        });
      };
      if (content.querySelector('#bulk-status')) content.querySelector('#bulk-status').onclick = function(){
        var ids = Object.keys(selected);
        if (!ids.length) return;
        openBulkStatusDialog(ids, function(results){
          results.forEach(function(r){
            if (r.ok){
              var idx = contacts.findIndex(function(c){ return String(c.id) === r.id; });
              if (idx > -1) contacts[idx] = r.updated;
            }
          });
          draw();
        });
      };
      content.querySelector('#bulk-cat').onclick = function(){
        var ids = Object.keys(selected).map(Number);
        if (!ids.length) return;
        openBulkCategoryDialog(ids, function(updated){
          updated.forEach(function(u){
            var idx = contacts.findIndex(function(c){ return c.id === u.id; });
            if (idx > -1) contacts[idx] = u;
          });
          loadShared();
          draw();
        });
      };
      content.querySelector('#bulk-del').onclick = function(){
        var ids = Object.keys(selected);
        if (!ids.length) return;
        if (!confirm('למחוק ' + ids.length + ' אנשי קשר נבחרים? הפעולה בלתי הפיכה.')) return;
        api('/contacts/bulk-delete', {method:'POST', body: JSON.stringify({ids: ids.map(Number)})}).then(function(){
          contacts = contacts.filter(function(c){ return !selected[c.id]; });
          selected = {};
          draw();
        }).catch(function(e){ alert(e.message); });
      };
      content.querySelector('#bulk-clear').onclick = function(){
        selected = {};
        draw();
      };

      function draw(){
        var filtered = getFiltered();
        content.querySelector('#count-pill').textContent = filtered.length === contacts.length ? contacts.length : (filtered.length + '/' + contacts.length);
        updateBulkBar();
        var body = content.querySelector('#list-body');
        if (!filtered.length){
          body.innerHTML = '<div class="empty"><span class="emoji">🍃</span>' + esc(opts.emptyMsg || 'לא נמצאו תוצאות.') + '</div>';
          return;
        }
        body.innerHTML = filtered.map(function(c){ return renderCard(c, opts, assignAmbs, selected); }).join('');
        wireCardActions(body);
      }

      function wireCardActions(body){
        Array.prototype.forEach.call(body.querySelectorAll('[data-open]'), function(el){
          el.onclick = function(){ openContact(el.getAttribute('data-open')); };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-select]'), function(cb){
          cb.onclick = function(ev){ ev.stopPropagation(); };
          cb.onchange = function(){
            var id = cb.getAttribute('data-select');
            if (cb.checked) selected[id] = true; else delete selected[id];
            updateBulkBar();
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-info]'), function(el){
          el.onclick = function(ev){
            ev.stopPropagation();
            openContact(el.getAttribute('data-info'));
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-del]'), function(el){
          el.onclick = function(ev){
            ev.stopPropagation();
            var id = el.getAttribute('data-del');
            var c = contacts.find(function(x){ return String(x.id) === id; });
            if (!confirm('למחוק את "' + (c ? c.name : '') + '" מהרשימה? הפעולה בלתי הפיכה.')) return;
            api('/contacts/' + id, {method:'DELETE'}).then(function(){
              contacts = contacts.filter(function(x){ return String(x.id) !== id; });
              draw();
            }).catch(function(e){ alert(e.message); });
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-claim]'), function(el){
          el.onclick = function(ev){
            ev.stopPropagation();
            var id = el.getAttribute('data-claim');
            api('/contacts/' + id + '/claim', {method:'POST'}).then(function(){
              contacts = contacts.filter(function(x){ return String(x.id) !== id; });
              draw();
            }).catch(function(e){ alert(e.message); });
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-cand-take]'), function(el){
          el.onclick = function(ev){
            ev.stopPropagation();
            var id = el.getAttribute('data-cand-take');
            api('/contacts/' + id + '/candidate', {method:'POST', body: JSON.stringify({candidate:true, owner:'me'})}).then(function(updated){
              var idx = contacts.findIndex(function(x){ return String(x.id) === id; });
              if (idx > -1) contacts[idx] = updated;
              draw();
            }).catch(function(e){ alert(e.message); });
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-cand-release]'), function(el){
          el.onclick = function(ev){
            ev.stopPropagation();
            var id = el.getAttribute('data-cand-release');
            api('/contacts/' + id + '/candidate', {method:'POST', body: JSON.stringify({candidate:true, owner:'open'})}).then(function(updated){
              var idx = contacts.findIndex(function(x){ return String(x.id) === id; });
              if (idx > -1) contacts[idx] = updated;
              draw();
            }).catch(function(e){ alert(e.message); });
          };
        });
        Array.prototype.forEach.call(body.querySelectorAll('[data-assign]'), function(sel){
          sel.onchange = function(){
            var id = sel.getAttribute('data-assign');
            api('/contacts/' + id + '/assign', {method:'POST', body: JSON.stringify({ambassadorId: sel.value ? parseInt(sel.value, 10) : null})})
              .then(function(updated){
                var idx = contacts.findIndex(function(x){ return String(x.id) === id; });
                if (idx > -1) contacts[idx] = updated;
              }).catch(function(e){ alert(e.message); });
          };
        });
      }

      content.querySelector('#f-q').oninput = function(e){ filters.q = e.target.value; draw(); };
      content.querySelector('#f-sort').onchange = function(e){ filters.sort = e.target.value; draw(); };
      content.querySelector('#f-cat').onchange = function(e){ filters.cat = e.target.value; draw(); };
      content.querySelector('#f-status').onchange = function(e){ filters.status = e.target.value; draw(); };
      if (content.querySelector('#f-amb')) content.querySelector('#f-amb').onchange = function(e){ filters.amb = e.target.value; draw(); };
      content.querySelector('#f-uncat').onchange = function(e){ filters.uncategorized = e.target.checked; draw(); };

      draw();
    }).catch(function(e){
      content.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  function uniqueCats(contacts){
    var set = {};
    contacts.forEach(function(c){ (c.categories || []).forEach(function(cat){ set[cat.name] = true; }); });
    return Object.keys(set).sort();
  }

  function categoriesBadges(c){
    if (!c.categories || !c.categories.length) return '<span class="badge-cat" style="color:#b45309;background:#fff7e6">ללא סיווג</span>';
    return c.categories.map(function(cat){
      var col = categoryColor(cat);
      return '<span class="badge-cat" style="background:' + col.bg + ';color:' + col.fg + '">' + esc(cat.name) + '</span>';
    }).join('');
  }

  function renderCard(c, opts, assignAmbs, selected){
    // ב"הכל" וב"פתוחים" מדלגים על תגית "טרם נקבע סטטוס" כשאין סטטוס — היא מיותרת שם
    // (בפתוחים כפתור "קח לרשימה שלי" כבר אומר את זה; ב"הכל" זה סתם רעש ברשימה גדולה)
    var statusBadge = c.status
      ? '<span class="badge-status" style="background:' + (STATUS_COLORS[c.status] || '#888') + '">' + esc(c.status) + '</span>'
      : (opts.scope === 'all' || opts.scope === 'unassigned' ? '' : '<span class="badge-cat" style="color:#b45309;background:#fff7e6">טרם נקבע סטטוס</span>');
    var ambBadge = (opts.scope === 'all' || opts.scope === 'candidates') && c.ambassador
      ? '<span class="badge-amb">שגריר: ' + esc(c.ambassador.name) + '</span>' : '';
    var candidateBadge = c.isAmbassadorCandidate ? '<span class="badge-amb">🌟 מועמד/ת לשגרירות</span>' : '';
    var selfBadge = c.selfOfAmbassador ? '<span class="badge-amb">👤 זה ' + esc(c.selfOfAmbassador.name) + '</span>' : '';

    var actionsHtml = '';
    if (opts.scope === 'unassigned'){
      actionsHtml = '<div class="card-actions"><button class="btn btn-gold btn-sm" data-claim="' + c.id + '">✋ קח לרשימה שלי</button></div>';
    } else if (opts.scope === 'candidates'){
      if (c.candidateOwner && c.candidateOwner.id === state.me.id){
        actionsHtml = '<div class="card-actions"><button class="btn btn-outline btn-sm" data-cand-release="' + c.id + '">לוותר על האחריות</button></div>';
      } else if (!c.candidateOwner){
        actionsHtml = '<div class="card-actions"><button class="btn btn-gold btn-sm" data-cand-take="' + c.id + '">✋ אני לוקח אחריות</button></div>';
      } else {
        actionsHtml = '<div class="card-actions"><span class="hint">אחראי/ת: ' + esc(c.candidateOwner.name) + '</span></div>';
      }
    } else if (opts.scope === 'all'){
      var pieces = [];
      if (!c.ambassador){
        pieces.push('<button class="btn btn-gold btn-sm" data-claim="' + c.id + '">✋ קח לרשימה שלי</button>');
      }
      if (pieces.length) actionsHtml += '<div class="card-actions">' + pieces.join('') + '</div>';
      if (state.me.isAdmin && assignAmbs){
        actionsHtml += '<div class="field" style="margin-top:10px;margin-bottom:0"><label>שיוך לשגריר</label>' +
          '<select data-assign="' + c.id + '"><option value="">— ללא שיוך —</option>' +
          assignAmbs.map(function(a){ return '<option value="' + a.id + '" ' + (c.ambassador && c.ambassador.id === a.id ? 'selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') +
          '</select></div>';
      }
    }

    return '<div class="card" data-open="' + c.id + '" style="cursor:pointer">' +
      '<div class="card-top">' +
      '<div style="display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0">' +
        '<input type="checkbox" data-select="' + c.id + '" ' + (selected && selected[c.id] ? 'checked' : '') + ' style="margin-top:4px;flex-shrink:0">' +
        '<div><div class="card-name">' + esc(c.name) + '</div>' +
        '<div class="card-meta">' + (c.phone ? '<a href="tel:' + esc(c.phone) + '" onclick="event.stopPropagation()">📞 ' + esc(c.phone) + '</a>' : '') + '</div></div>' +
      '</div>' +
      '<button class="link-btn" data-info="' + c.id + '" title="שיח פנימי — מי מכיר את זה?">ℹ️' + (c.commentsCount ? ' ' + c.commentsCount : '') + '</button>' +
      '<button class="link-btn danger" data-del="' + c.id + '" title="מחיקה">🗑️</button></div>' +
      '<div class="badges">' + categoriesBadges(c) + statusBadge + ambBadge + candidateBadge + selfBadge + '</div>' +
      actionsHtml +
    '</div>';
  }

  // ===================== עדכון סטטוס מרוכז לנבחרים =====================
  function openBulkStatusDialog(ids, onApplied){
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="sheet"></div>';
    document.body.appendChild(overlay);
    overlay.onclick = function(e){ if (e.target === overlay) overlay.remove(); };
    var sheet = overlay.querySelector('.sheet');

    sheet.innerHTML =
      '<div class="sheet-head"><h3>עדכון סטטוס ל-' + ids.length + ' נבחרים</h3><button class="close-x" id="bs-close">✕</button></div>' +
      '<div class="hint" style="margin-bottom:10px">מי מהנבחרים שעדיין לא משויך לשגריר — ישויך אוטומטית אליכם.</div>' +
      '<div class="status-grid">' + state.statuses.map(function(s){
        return '<button class="status-opt" data-bs-status="' + esc(s) + '">' +
          '<span>' + esc(s) + '</span><span class="dot" style="background:' + STATUS_COLORS[s] + '"></span></button>';
      }).join('') + '</div>' +
      '<button class="btn btn-outline btn-sm" id="bs-clear" style="width:100%;margin-top:8px">❌ ביטול סימון סטטוס לנבחרים</button>';

    sheet.querySelector('#bs-close').onclick = function(){ overlay.remove(); };

    function apply(status){
      Promise.all(ids.map(function(id){
        return api('/contacts/' + id + '/status', {method:'POST', body: JSON.stringify({status:status})})
          .then(function(updated){ return {id:id, ok:true, updated:updated}; })
          .catch(function(e){ return {id:id, ok:false, error:e.message}; });
      })).then(function(results){
        overlay.remove();
        onApplied(results);
      });
    }
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-bs-status]'), function(btn){
      btn.onclick = function(){ apply(btn.getAttribute('data-bs-status')); };
    });
    sheet.querySelector('#bs-clear').onclick = function(){ apply(null); };
  }

  // ===================== סיווג מרוכז לנבחרים (רשימת סימון) =====================
  function openBulkCategoryDialog(ids, onApplied){
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="sheet"></div>';
    document.body.appendChild(overlay);
    overlay.onclick = function(e){ if (e.target === overlay) overlay.remove(); };
    var sheet = overlay.querySelector('.sheet');
    var checkedNames = {};

    function draw(){
      sheet.innerHTML =
        '<div class="sheet-head"><h3>סיווג ' + ids.length + ' נבחרים</h3><button class="close-x" id="bc-close">✕</button></div>' +
        '<div class="hint" style="margin-bottom:10px">מסמנים סיווג אחד או יותר — הם יתווספו לכל אחד מה-' + ids.length + ' הנבחרים (בלי למחוק סיווגים קיימים שלהם).</div>' +
        '<div id="bc-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">' +
          (state.categories.length ? state.categories.map(function(cat){
            var col = categoryColor(cat);
            return '<label style="display:flex;align-items:center;gap:8px;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer">' +
              '<input type="checkbox" data-bc-cat value="' + esc(cat.name) + '" ' + (checkedNames[cat.name] ? 'checked' : '') + '>' +
              '<span class="badge-cat" style="background:' + col.bg + ';color:' + col.fg + '">' + esc(cat.name) + '</span>' +
            '</label>';
          }).join('') : '<div class="hint">אין עדיין סיווגים — אפשר להוסיף אחד חדש למטה.</div>') +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:16px">' +
          '<input id="bc-new" placeholder="הוספת סיווג חדש…" style="flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fbfbfc">' +
          '<button class="btn btn-outline btn-sm" id="bc-newbtn">הוספה לרשימה</button>' +
        '</div>' +
        '<button class="btn btn-primary" id="bc-apply">✅ החלת סיווג על ' + ids.length + ' נבחרים</button>';

      sheet.querySelector('#bc-close').onclick = function(){ overlay.remove(); };

      function syncChecked(){
        checkedNames = {};
        Array.prototype.forEach.call(sheet.querySelectorAll('[data-bc-cat]:checked'), function(cb){ checkedNames[cb.value] = true; });
      }

      sheet.querySelector('#bc-newbtn').onclick = function(){
        syncChecked();
        var v = sheet.querySelector('#bc-new').value.trim();
        if (!v) return;
        if (!state.categories.some(function(c){ return c.name === v; })){
          state.categories.push({id: 'new:' + v, name: v});
        }
        checkedNames[v] = true;
        draw();
      };
      sheet.querySelector('#bc-new').addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); sheet.querySelector('#bc-newbtn').click(); }
      });

      sheet.querySelector('#bc-apply').onclick = function(){
        syncChecked();
        var names = Object.keys(checkedNames);
        if (!names.length){ alert('יש לבחור לפחות סיווג אחד'); return; }
        api('/contacts/bulk-categories', {method:'POST', body: JSON.stringify({ids: ids, categories: names})}).then(function(updated){
          overlay.remove();
          onApplied(updated);
        }).catch(function(e){ alert(e.message); });
      };
    }
    draw();
  }

  // ===================== CONTACT DETAIL MODAL =====================
  function openContact(id){
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="sheet"><div class="spinner">טוען…</div></div>';
    document.body.appendChild(overlay);
    overlay.onclick = function(e){ if (e.target === overlay) overlay.remove(); };

    Promise.all([findContact(id), api('/contacts/' + id + '/history')]).then(function(results){
      drawSheet(overlay, results[0], results[1]);
    }).catch(function(e){
      overlay.querySelector('.sheet').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  function findContact(id){
    // scope=all פתוח לכולם — כך כל שגריר יכול לפתוח כל איש קשר מכל מסך
    return api('/contacts?scope=all').then(function(list){
      return list.find(function(c){ return String(c.id) === String(id); }) || null;
    });
  }

  function renderCandidateSection(contact){
    if (!contact.isAmbassadorCandidate){
      return '<div class="hint" style="margin-bottom:8px">האם מתאים/ה להיות שגריר/ה?</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-gold btn-sm" id="cand-mark-take">🌟 כן, ואני לוקח אחריות</button>' +
        '<button class="btn btn-outline btn-sm" id="cand-mark-open">🌟 כן, אבל לשאול שגרירים אחרים</button>' +
      '</div>';
    }
    var owner = contact.candidateOwner;
    return '<div class="badges" style="margin-bottom:10px">' +
        (owner ? '<span class="badge-amb">אחראי/ת: ' + esc(owner.name) + '</span>' : '<span class="badge-status" style="background:#7c3aed">פתוח — מי לוקח אחריות?</span>') +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        (owner && owner.id === state.me.id
          ? '<button class="btn btn-outline btn-sm" id="cand-release">לוותר על האחריות</button>'
          : (!owner ? '<button class="btn btn-gold btn-sm" id="cand-take">✋ אני לוקח אחריות</button>' : '')) +
        '<button class="btn btn-outline btn-sm" id="cand-unmark">הסרת סימון מועמדות</button>' +
      '</div>';
  }

  function renderSelfSection(contact){
    var self = contact.selfOfAmbassador;
    if (self && self.id === state.me.id) return '<button class="btn btn-outline btn-sm" id="self-unset">❌ זה לא אני</button>';
    if (self) return '<span class="hint">מסומן כ"זה אני" על ידי ' + esc(self.name) + '</span>';
    return '<button class="btn btn-outline btn-sm" id="self-set">👤 זה אני (השגריר)</button>';
  }

  function renderDiscussionList(comments){
    if (!comments.length) return '<div class="hint">אין עדיין הודעות. מזהים את השם או יודעים איך ליצור קשר? כתבו כאן!</div>';
    return '<div class="timeline">' + comments.map(function(cm){
      var canDelete = state.me.isAdmin || (cm.ambassador && cm.ambassador.id === state.me.id);
      return '<div class="tl-item">' +
        '<div class="tl-dot" style="background:var(--info)"></div>' +
        '<div class="tl-body"><div class="tl-status">' + esc(cm.ambassador ? cm.ambassador.name : 'לא ידוע') + '</div>' +
        '<div style="font-size:13px;margin:2px 0;white-space:pre-wrap">' + esc(cm.message) + '</div>' +
        '<div class="tl-meta">' + fmtDate(cm.createdAt) + (canDelete ? ' · <a href="#" data-rmcomment="' + cm.id + '" style="color:var(--danger);text-decoration:none">מחיקה</a>' : '') + '</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function loadDiscussion(sheet, contact){
    api('/contacts/' + contact.id + '/comments').then(function(comments){
      var list = sheet.querySelector('#discussion-list');
      if (!list) return;
      list.innerHTML = renderDiscussionList(comments);
      Array.prototype.forEach.call(list.querySelectorAll('[data-rmcomment]'), function(a){
        a.onclick = function(ev){
          ev.preventDefault();
          if (!confirm('למחוק הודעה זו?')) return;
          api('/contacts/' + contact.id + '/comments/' + a.getAttribute('data-rmcomment'), {method:'DELETE'})
            .then(function(){ loadDiscussion(sheet, contact); }).catch(function(e){ alert(e.message); });
        };
      });
    }).catch(function(e){
      var list = sheet.querySelector('#discussion-list');
      if (list) list.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  function drawSheet(overlay, contact, history){
    var sheet = overlay.querySelector('.sheet');
    var catList = state.categories.map(function(c){ return '<option value="' + esc(c.name) + '">'; }).join('');
    var cats = contact.categories || [];

    sheet.innerHTML =
      '<div class="sheet-head"><h3>' + esc(contact.name) + '</h3><button class="close-x" id="sh-close">✕</button></div>' +

      '<div class="sec-title" style="margin-bottom:8px">עדכון סטטוס</div>' +
      '<div class="status-grid">' + state.statuses.map(function(s){
        var sel = contact.status === s;
        return '<button class="status-opt ' + (sel ? 'sel' : '') + '" data-status="' + esc(s) + '">' +
          '<span>' + esc(s) + '</span><span class="dot" style="background:' + STATUS_COLORS[s] + '"></span></button>';
      }).join('') + '</div>' +
      (contact.status ? '<div class="hint">לחיצה נוספת על הסטטוס המסומן תבטל את הסימון.</div>' : '') +

      (contact.ambassador
        ? '<div class="hint">שגריר אחראי: ' + esc(contact.ambassador.name) +
          ((state.me.isAdmin || contact.ambassador.id === state.me.id)
            ? ' · <a href="#" id="unassign-link" style="color:var(--danger);text-decoration:none">ביטול שיוך</a>' : '') +
          '</div>'
        : '<div class="hint">לא משויך לשגריר</div>') +
      '<div style="margin-top:8px">' + renderSelfSection(contact) + '</div>' +

      '<hr class="divider">' +
      '<div class="field"><label>שם</label><input id="e-name" value="' + esc(contact.name) + '"></div>' +
      '<div class="field"><label>טלפון</label><input id="e-phone" type="tel" value="' + esc(contact.phone || '') + '"></div>' +
      '<div class="field"><label>הערות</label><textarea id="e-notes">' + esc(contact.notes || '') + '</textarea></div>' +
      '<button class="btn btn-primary" id="sh-save">💾 שמירת פרטים</button>' +

      '<hr class="divider">' +
      '<div class="sec-title" style="margin-bottom:8px">💬 שיח פנימי — מי מכיר את זה?</div>' +
      '<div id="discussion-list"><div class="hint">טוען…</div></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<input id="disc-input" placeholder="למשל: מישהו מכיר? מאיפה?" style="flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fbfbfc">' +
        '<button class="btn btn-outline btn-sm" id="disc-send">שליחה</button>' +
      '</div>' +

      '<hr class="divider">' +
      '<div class="sec-title" style="margin-bottom:8px">סיווגים</div>' +
      '<div class="badges" style="margin-bottom:10px">' +
        (cats.length ? cats.map(function(cat){
          var col = categoryColor(cat);
          return '<span class="badge-cat" style="background:' + col.bg + ';color:' + col.fg + '">' + esc(cat.name) + ' <a href="#" data-rmcat="' + cat.id + '" style="color:inherit;opacity:.6;text-decoration:none;margin-inline-start:4px">✕</a></span>';
        }).join('') : '<span class="hint">אין עדיין סיווג</span>') +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:16px">' +
        '<input id="cat-add-input" list="cat-dl" placeholder="הוספת סיווג…" style="flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fbfbfc">' +
        '<button class="btn btn-outline btn-sm" id="cat-add-btn">הוספה</button>' +
      '</div>' +
      '<datalist id="cat-dl">' + catList + '</datalist>' +

      '<hr class="divider">' +
      '<div class="sec-title" style="margin-bottom:8px">🌟 האם מתאים/ה להיות שגריר/ה?</div>' +
      renderCandidateSection(contact) +

      '<hr class="divider">' +
      '<div class="sec-title" style="margin-bottom:8px">היסטוריית סטטוסים</div>' +
      renderTimeline(history) +

      '<hr class="divider">' +
      '<button class="btn btn-danger" id="sh-delete" style="width:100%">🗑️ מחיקת איש קשר מהרשימה</button>';

    sheet.querySelector('#sh-close').onclick = function(){ overlay.remove(); };

    loadDiscussion(sheet, contact);
    sheet.querySelector('#disc-send').onclick = function(){
      var v = sheet.querySelector('#disc-input').value.trim();
      if (!v) return;
      api('/contacts/' + contact.id + '/comments', {method:'POST', body: JSON.stringify({message:v})}).then(function(){
        sheet.querySelector('#disc-input').value = '';
        loadDiscussion(sheet, contact);
      }).catch(function(e){ alert(e.message); });
    };
    sheet.querySelector('#disc-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); sheet.querySelector('#disc-send').click(); }
    });

    sheet.querySelector('#sh-save').onclick = function(){
      var payload = {
        name: sheet.querySelector('#e-name').value.trim(),
        phone: sheet.querySelector('#e-phone').value.trim(),
        notes: sheet.querySelector('#e-notes').value.trim()
      };
      api('/contacts/' + contact.id, {method:'PATCH', body: JSON.stringify(payload)}).then(function(){
        overlay.remove();
        renderApp();
      }).catch(function(e){ alert(e.message); });
    };

    function submitCategories(newNames){
      api('/contacts/' + contact.id + '/categories', {method:'POST', body: JSON.stringify({categories:newNames})}).then(function(updated){
        loadShared().then(function(){ drawSheet(overlay, updated, history); });
      }).catch(function(e){ alert(e.message); });
    }
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-rmcat]'), function(a){
      a.onclick = function(ev){
        ev.preventDefault();
        var id = a.getAttribute('data-rmcat');
        submitCategories(cats.filter(function(c){ return String(c.id) !== id; }).map(function(c){ return c.name; }));
      };
    });
    sheet.querySelector('#cat-add-btn').onclick = function(){
      var v = sheet.querySelector('#cat-add-input').value.trim();
      if (!v) return;
      var names = cats.map(function(c){ return c.name; });
      if (names.indexOf(v) === -1) names.push(v);
      submitCategories(names);
    };
    sheet.querySelector('#cat-add-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); sheet.querySelector('#cat-add-btn').click(); }
    });

    Array.prototype.forEach.call(sheet.querySelectorAll('[data-status]'), function(btn){
      btn.onclick = function(){
        var status = btn.getAttribute('data-status');
        var payload = status === contact.status ? {status: null} : {status: status};
        api('/contacts/' + contact.id + '/status', {method:'POST', body: JSON.stringify(payload)}).then(function(){
          overlay.remove();
          renderApp();
        }).catch(function(e){ alert(e.message); });
      };
    });

    function candidateCall(body){
      api('/contacts/' + contact.id + '/candidate', {method:'POST', body: JSON.stringify(body)}).then(function(){
        overlay.remove();
        renderApp();
      }).catch(function(e){ alert(e.message); });
    }
    var el;
    if ((el = sheet.querySelector('#cand-mark-take'))) el.onclick = function(){ candidateCall({candidate:true, owner:'me'}); };
    if ((el = sheet.querySelector('#cand-mark-open'))) el.onclick = function(){ candidateCall({candidate:true, owner:'open'}); };
    if ((el = sheet.querySelector('#cand-take'))) el.onclick = function(){ candidateCall({candidate:true, owner:'me'}); };
    if ((el = sheet.querySelector('#cand-release'))) el.onclick = function(){ candidateCall({candidate:true, owner:'open'}); };
    if ((el = sheet.querySelector('#cand-unmark'))) el.onclick = function(){ candidateCall({candidate:false}); };

    if ((el = sheet.querySelector('#self-set'))) el.onclick = function(){
      api('/contacts/' + contact.id + '/self', {method:'POST', body: JSON.stringify({self:true})})
        .then(function(){ overlay.remove(); renderApp(); }).catch(function(e){ alert(e.message); });
    };
    if ((el = sheet.querySelector('#self-unset'))) el.onclick = function(){
      api('/contacts/' + contact.id + '/self', {method:'POST', body: JSON.stringify({self:false})})
        .then(function(){ overlay.remove(); renderApp(); }).catch(function(e){ alert(e.message); });
    };

    if ((el = sheet.querySelector('#unassign-link'))) el.onclick = function(ev){
      ev.preventDefault();
      if (!confirm('לבטל את השיוך שלך ל"' + contact.name + '"? האיש יעבור לרשימת "לא משויכים".')) return;
      api('/contacts/' + contact.id + '/unassign', {method:'POST'})
        .then(function(){ overlay.remove(); renderApp(); }).catch(function(e){ alert(e.message); });
    };

    sheet.querySelector('#sh-delete').onclick = function(){
      if (!confirm('למחוק את "' + contact.name + '" מהרשימה? הפעולה בלתי הפיכה (כולל היסטוריית הסטטוסים).')) return;
      api('/contacts/' + contact.id, {method:'DELETE'}).then(function(){
        overlay.remove();
        renderApp();
      }).catch(function(e){ alert(e.message); });
    };
  }

  function renderTimeline(history){
    if (!history.history.length) return '<div class="hint">עדיין לא נרשם סטטוס.</div>';
    var n = history.history.length;
    return '<div class="timeline">' + history.history.map(function(h, i){
      var label = i === 0 ? 'סטטוס ראשוני' : (i === n - 1 ? 'סטטוס נוכחי' : 'סטטוס קודם');
      return '<div class="tl-item">' +
        (i < n - 1 ? '<div class="tl-line"></div>' : '') +
        '<div class="tl-dot" style="background:' + (STATUS_COLORS[h.status]||'#888') + '"></div>' +
        '<div class="tl-body"><div class="tl-status">' + esc(h.status) + ' <span style="color:var(--muted);font-weight:500">· ' + label + '</span></div>' +
        '<div class="tl-meta">' + fmtDate(h.changed_at) + (h.changed_by ? ' · ' + esc(h.changed_by) : '') + '</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  // ===================== סטטיסטיקה ולוח מובילים =====================
  var MOTIVATIONAL_QUOTES = [
    'כל שיחה נוספת שאתם עושים היא עוד לבנה בבניין המוסדות של חב"ד עפולה — תודה על המסירות!',
    'אין דבר העומד בפני הרצון — וההתקדמות שלכם היא הוכחה חיה לכך. ממשיכים קדימה!',
    'הרבי תמיד אמר שכל יהודי הוא שליח — ואתם ממש מגשימים את זה בכל שיחה.',
    'הערב הזה יקרה בזכותכם. כל "כן" שאתם מקבלים הוא ניצחון בשביל כל הקהילה.',
    'מעשה קטן שלכם היום — שיחה אחת, טלפון אחד — יכול להביא שינוי גדול מחר.',
    'אתם לא רק מגייסים לאירוע — אתם בונים קהילה. יישר כוח!',
    'כל איש קשר שהתקדם בזכותכם הוא סימן שהמאמץ שלכם עובד. תמשיכו כך!',
    'בזכות שגרירים כמוכם, ערב השותפות הזה קורם עור וגידים מהר מהצפוי!',
    'גם שיחה שלא הצליחה היא חלק מהדרך — ממשיכים לחייג, לדבר, ולהאמין.',
    'המוסדות של חב"ד עפולה גדלים בזכות אנשים כמוכם שמוכנים להשקיע מזמנם. תודה ענקית!',
    'לא משנה כמה קשה השיחה — כל ניסיון הוא זריעה, והקציר יגיע.',
    'אתם השליחים של הרבי בשטח — וכל שיחה שלכם ממשיכה את השליחות שלו.'
  ];

  function pickRandom(arr, n){
    var copy = arr.slice();
    var out = [];
    while (copy.length && out.length < n){
      out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    return out;
  }

  function renderBarChart(rows, color){
    if (!rows.length) return '<div class="hint">אין עדיין נתונים להצגה.</div>';
    var max = Math.max.apply(null, rows.map(function(r){ return r.value; })) || 1;
    return '<div class="barchart">' + rows.map(function(r){
      var pct = Math.max(4, Math.round((r.value / max) * 100));
      return '<div class="bar-row">' +
        '<div class="bar-label">' + esc(r.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="bar-value">' + r.value + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function renderTimelineSvg(points){
    if (!points.length) return '<div class="hint">עדיין אין אנשים בסטטוס "מגיע לאירוע" — ברגע שיהיו, כאן יופיע קו ההתקדמות.</div>';
    if (points.length === 1){
      var onlyDay = new Date(points[0].day);
      return '<div style="text-align:center;padding:10px 0">' +
        '<div style="font-size:34px;font-weight:800;color:var(--navy)">' + points[0].cumulative + '</div>' +
        '<div class="hint">אנשים הגיעו לסטטוס "מגיע לאירוע" עד כה (' + esc(onlyDay.toLocaleDateString('he-IL')) + ') — הגרף יתמלא ככל שיעברו עוד ימים.</div>' +
      '</div>';
    }
    var w = 320, h = 140, pad = 26;
    var maxY = points[points.length - 1].cumulative || 1;
    var stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
    var coords = points.map(function(p, i){
      var x = pad + i * stepX;
      var y = h - pad - (p.cumulative / maxY) * (h - pad * 2);
      return {x:x, y:y, p:p};
    });
    var linePath = coords.map(function(c, i){ return (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');
    var areaPath = linePath + ' L' + coords[coords.length - 1].x.toFixed(1) + ',' + (h - pad) + ' L' + coords[0].x.toFixed(1) + ',' + (h - pad) + ' Z';
    var dots = coords.map(function(c){
      var d = new Date(c.p.day);
      return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.5" fill="#1e293b"><title>' + esc(d.toLocaleDateString('he-IL')) + ': סה"כ ' + c.p.cumulative + '</title></circle>';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + areaPath + '" fill="rgba(30,41,59,0.12)" stroke="none"></path>' +
      '<path d="' + linePath + '" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>' +
      dots +
    '</svg>';
  }

  function renderStats(content){
    content.innerHTML = '<div class="spinner">טוען…</div>';
    Promise.all([api('/stats/ambassadors'), api('/stats/timeline')]).then(function(res){
      var ambStats = res[0];
      var timeline = res[1];

      var arriving = ambStats.map(function(a){ return {label:a.name, value:(a.byStatus['מגיע לאירוע'] || 0)}; })
        .filter(function(r){ return r.value > 0; }).sort(function(a, b){ return b.value - a.value; });
      var effort = ambStats.map(function(a){ return {label:a.name, value:a.updatesCount}; })
        .filter(function(r){ return r.value > 0; }).sort(function(a, b){ return b.value - a.value; });
      var leaderboard = ambStats.slice().sort(function(a, b){
        return (b.byStatus['מגיע לאירוע'] || 0) - (a.byStatus['מגיע לאירוע'] || 0);
      });

      var quotes = pickRandom(MOTIVATIONAL_QUOTES, 2);
      var top = arriving[0];

      content.innerHTML =
        '<div class="sec-title">סטטיסטיקה ולוח מובילים</div>' +

        '<div class="card" style="background:linear-gradient(135deg,#fff7e6,#fff)">' +
          (top ? '<div style="font-weight:800;color:var(--navy);margin-bottom:6px">🎉 ' + esc(top.label) + ' מוביל/ה עם ' + top.value + ' אנשים שהגיעו לסטטוס "מגיע לאירוע"!</div>' : '') +
          quotes.map(function(q){ return '<div class="hint" style="font-size:12.5px;margin-bottom:4px">💛 ' + esc(q) + '</div>'; }).join('') +
        '</div>' +

        '<div class="sec-title" style="margin-top:18px">מי הביא הכי הרבה אנשים ל"מגיע לאירוע"</div>' +
        renderBarChart(arriving, 'var(--gold)') +

        '<div class="sec-title" style="margin-top:18px">מי הכי משקיע (מספר עדכוני סטטוס)</div>' +
        renderBarChart(effort, 'var(--navy)') +

        '<div class="sec-title" style="margin-top:18px">קצב ההתקדמות של כולם (הגעות מצטברות לאורך זמן)</div>' +
        '<div class="card">' + renderTimelineSvg(timeline) + '</div>' +

        '<div class="sec-title" style="margin-top:18px">לוח שגרירים מלא</div>' +
        (leaderboard.length ? leaderboard.map(function(a){
          var badges = state.statuses.map(function(s){
            var cnt = a.byStatus[s] || 0;
            return cnt ? '<span class="badge-status" style="background:' + (STATUS_COLORS[s] || '#888') + '">' + esc(s) + ': ' + cnt + '</span>' : '';
          }).join('');
          var noneCnt = a.byStatus['טרם נקבע סטטוס'] || 0;
          return '<div class="card">' +
            '<div class="card-name">' + esc(a.name) + '</div>' +
            '<div class="hint">סה"כ אחראי/ת על ' + a.total + ' אנשים · ' + a.updatesCount + ' עדכוני סטטוס</div>' +
            '<div class="badges">' + badges + (noneCnt ? '<span class="badge-cat">טרם נקבע סטטוס: ' + noneCnt + '</span>' : '') + '</div>' +
          '</div>';
        }).join('') : '<div class="empty">אין עדיין שגרירים עם אנשים ברשימה.</div>');
    }).catch(function(e){
      content.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  // ===================== ADD CONTACT =====================
  function renderAdd(content){
    var catList = state.categories.map(function(c){ return '<option value="' + esc(c.name) + '">'; }).join('');
    var ambOptions = '';
    content.innerHTML =
      '<div class="sec-title">הוספת איש קשר חדש</div>' +
      '<div class="field"><label>שם מלא *</label><input id="a-name"></div>' +
      '<div class="field"><label>טלפון</label><input id="a-phone" type="tel"></div>' +
      '<div class="field"><label>סיווג (אפשר כמה, מופרד בפסיק)</label><input id="a-cat" list="cat-dl2" placeholder="לדוגמה: קהילה, הורה בית ספר"></div>' +
      '<datalist id="cat-dl2">' + catList + '</datalist>' +
      '<div class="field"><label>הערות</label><textarea id="a-notes"></textarea></div>' +
      (state.me.isAdmin ? '<div class="field" id="a-amb-wrap"><label>שיוך לשגריר</label><select id="a-amb"><option value="">אני (' + esc(state.me.name) + ')</option><option value="none">ללא שיוך — לרשימה הכללית</option></select></div>' : '') +
      '<div id="a-msg"></div>' +
      '<button class="btn btn-primary" id="a-submit">➕ הוספה לרשימה</button>' +
      '<div class="hint">איש קשר חדש שתוסיפו ישויך אוטומטית אליכם, אלא אם תבחרו אחרת.</div>';

    if (state.me.isAdmin){
      api('/ambassadors').then(function(ambs){
        var sel = content.querySelector('#a-amb');
        ambs.forEach(function(a){
          if (a.id === state.me.id) return;
          var opt = document.createElement('option');
          opt.value = a.id; opt.textContent = a.name;
          sel.appendChild(opt);
        });
      }).catch(function(){});
    }

    content.querySelector('#a-submit').onclick = function(){
      var name = content.querySelector('#a-name').value.trim();
      var msg = content.querySelector('#a-msg');
      if (!name){ msg.innerHTML = '<div class="err">יש להזין שם</div>'; return; }
      var payload = {
        name: name,
        phone: content.querySelector('#a-phone').value.trim(),
        categories: content.querySelector('#a-cat').value.trim(),
        notes: content.querySelector('#a-notes').value.trim()
      };
      if (state.me.isAdmin){
        var val = content.querySelector('#a-amb').value;
        if (val === 'none') payload.ambassadorId = null;
        else if (val) payload.ambassadorId = parseInt(val, 10);
      }
      api('/contacts', {method:'POST', body: JSON.stringify(payload)}).then(function(){
        msg.innerHTML = '<div class="ok-msg">נוסף בהצלחה ✔️</div>';
        content.querySelector('#a-name').value = '';
        content.querySelector('#a-phone').value = '';
        content.querySelector('#a-cat').value = '';
        content.querySelector('#a-notes').value = '';
        loadShared();
      }).catch(function(e){
        msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      });
    };
  }

  // ===================== ADMIN =====================
  function renderAdmin(content){
    content.innerHTML =
      '<div class="admin-tabs">' +
        '<button data-at="ambassadors" class="' + (state.adminTab==='ambassadors'?'active':'') + '">שגרירים</button>' +
        '<button data-at="categories" class="' + (state.adminTab==='categories'?'active':'') + '">קטגוריות</button>' +
        '<button data-at="import" class="' + (state.adminTab==='import'?'active':'') + '">ייבוא</button>' +
      '</div>' +
      '<div class="hint" style="margin-bottom:12px">לצפייה בכל אנשי הקשר ולשיוך מחדש לשגריר — לשונית "הכל" בתפריט התחתון.</div>' +
      '<div id="admin-body"><div class="spinner">טוען…</div></div>';

    Array.prototype.forEach.call(content.querySelectorAll('[data-at]'), function(btn){
      btn.onclick = function(){ state.adminTab = btn.getAttribute('data-at'); renderAdmin(content); };
    });

    var body = content.querySelector('#admin-body');
    if (state.adminTab === 'ambassadors') renderAdminAmbassadors(body);
    else if (state.adminTab === 'categories') renderAdminCategories(body);
    else if (state.adminTab === 'import') renderAdminImport(body);
  }

  function renderAdminAmbassadors(body){
    api('/ambassadors').then(function(ambs){
      state.ambassadors = ambs;
      body.innerHTML =
        '<table class="simple"><thead><tr><th>שם</th><th>טלפון</th><th>אנשי קשר</th><th>מנהל</th><th></th></tr></thead><tbody>' +
        ambs.map(function(a){
          return '<tr><td>' + esc(a.name) + '</td><td>' + esc(a.phone || '—') + '</td><td>' + a.contactCount + '</td>' +
            '<td>' + (a.isAdmin ? '✔️' : '') + '</td>' +
            '<td>' +
              '<button class="link-btn" data-rename="' + a.id + '">✏️ שם</button> ' +
              (a.isAdmin ? '<button class="link-btn" data-repin="' + a.id + '">🔑 קוד</button> ' : '') +
              (a.id !== state.me.id ? '<button class="link-btn danger" data-del="' + a.id + '">מחיקה</button>' : '') +
            '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<hr class="divider">' +
        '<div class="sec-title">הוספת שגריר חדש</div>' +
        '<div class="field"><label>שם *</label><input id="na-name"></div>' +
        '<div class="field"><label>טלפון</label><input id="na-phone" type="tel"></div>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:12px">' +
          '<input type="checkbox" id="na-admin"> הרשאת מנהל</label>' +
        '<div class="field" id="na-pin-wrap" style="display:none"><label>קוד גישה (למנהל בלבד) *</label><input id="na-pin" type="tel" inputmode="numeric"></div>' +
        '<div id="na-msg"></div>' +
        '<button class="btn btn-gold" id="na-submit">➕ הוספת שגריר</button>' +
        '<div class="hint">לשגריר רגיל אין קוד כניסה בכלל — מוסיפים שם ומיד אפשר לבחור אותו ממסך "מי אתה?". רק למנהל יש קוד גישה.</div>';

      body.querySelector('#na-admin').onchange = function(e){
        body.querySelector('#na-pin-wrap').style.display = e.target.checked ? 'block' : 'none';
      };

      Array.prototype.forEach.call(body.querySelectorAll('[data-del]'), function(btn){
        btn.onclick = function(){
          if (!confirm('למחוק שגריר זה? אנשי הקשר שלו יעברו ל"לא משויכים".')) return;
          api('/ambassadors/' + btn.getAttribute('data-del'), {method:'DELETE'})
            .then(function(){ renderAdminAmbassadors(body); }).catch(function(e){ alert(e.message); });
        };
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-rename]'), function(btn){
        btn.onclick = function(){
          var id = btn.getAttribute('data-rename');
          var current = ambs.find(function(a){ return String(a.id) === id; });
          var name = window.prompt('שם חדש:', current ? current.name : '');
          if (!name || !name.trim()) return;
          api('/ambassadors/' + id, {method:'PATCH', body: JSON.stringify({name: name.trim()})})
            .then(function(){ renderAdminAmbassadors(body); }).catch(function(e){ alert(e.message); });
        };
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-repin]'), function(btn){
        btn.onclick = function(){
          var pin = window.prompt('קוד גישה חדש למנהל:');
          if (!pin) return;
          api('/ambassadors/' + btn.getAttribute('data-repin'), {method:'PATCH', body: JSON.stringify({pin:pin})})
            .then(function(){ alert('הקוד עודכן.'); }).catch(function(e){ alert(e.message); });
        };
      });
      body.querySelector('#na-submit').onclick = function(){
        var name = body.querySelector('#na-name').value.trim();
        var msg = body.querySelector('#na-msg');
        var isAdmin = body.querySelector('#na-admin').checked;
        var pin = body.querySelector('#na-pin').value.trim();
        if (!name){ msg.innerHTML = '<div class="err">יש להזין שם</div>'; return; }
        if (isAdmin && !pin){ msg.innerHTML = '<div class="err">יש להגדיר קוד גישה למנהל</div>'; return; }
        api('/ambassadors', {method:'POST', body: JSON.stringify({
          name: name,
          phone: body.querySelector('#na-phone').value.trim(),
          isAdmin: isAdmin,
          pin: pin
        })}).then(function(){
          renderAdminAmbassadors(body);
        }).catch(function(e){ msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
      };
    }).catch(function(e){ body.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }

  function renderAdminCategories(body){
    body.innerHTML =
      '<div class="field"><label>קטגוריה חדשה</label><div style="display:flex;gap:8px">' +
      '<input id="nc-name" style="flex:1"><button class="btn btn-gold btn-sm" id="nc-add">הוספה</button></div></div>' +
      '<div id="nc-list"><div class="spinner">טוען…</div></div>';

    function reload(){
      api('/categories').then(function(cats){
        state.categories = cats;
        var list = body.querySelector('#nc-list');
        if (!cats.length){ list.innerHTML = '<div class="hint">אין עדיין קטגוריות.</div>'; return; }
        list.innerHTML = cats.map(function(c){
          return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px">' +
            '<span>' + esc(c.name) + '</span><button class="link-btn danger" data-delc="' + c.id + '">מחיקה</button></div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('[data-delc]'), function(btn){
          btn.onclick = function(){
            api('/categories/' + btn.getAttribute('data-delc'), {method:'DELETE'}).then(reload).catch(function(e){ alert(e.message); });
          };
        });
      });
    }
    body.querySelector('#nc-add').onclick = function(){
      var v = body.querySelector('#nc-name').value.trim();
      if (!v) return;
      api('/categories', {method:'POST', body: JSON.stringify({name:v})}).then(function(){
        body.querySelector('#nc-name').value = '';
        reload();
      }).catch(function(e){ alert(e.message); });
    };
    reload();
  }

  function renderAdminImport(body){
    body.innerHTML =
      '<div class="sec-title">ייבוא רשימה מרוכז</div>' +
      '<div class="hint">הדביקו כאן שורות מתוך אקסל / Google Sheets (כל שורה = איש קשר אחד, מופרד בטאבים):<br>' +
      '<b>שם [טאב] טלפון [טאב] קטגוריה/ות [טאב] שם שגריר (אופציונלי)</b><br>' +
      'אפשר כמה קטגוריות באותה שורה, מופרדות בפסיק (לדוגמה: "קהילה, הורה בית ספר").<br>' +
      'אם לא צויין שגריר — איש הקשר יכנס לרשימה הכללית הלא-משויכת.</div>' +
      '<div class="field"><textarea id="imp-text" rows="8" placeholder="ישראל ישראלי	0501234567	הורה בית ספר	דוד כהן"></textarea></div>' +
      '<button class="btn btn-primary" id="imp-submit">📥 ייבוא</button>' +
      '<div id="imp-result" style="margin-top:14px"></div>';

    body.querySelector('#imp-submit').onclick = function(){
      var raw = body.querySelector('#imp-text').value;
      var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if (!lines.length){ alert('לא הודבק תוכן'); return; }
      var rows = lines.map(function(l){
        var parts = l.split('\t');
        return { name: (parts[0]||'').trim(), phone: (parts[1]||'').trim(), category: (parts[2]||'').trim(), ambassador: (parts[3]||'').trim() };
      });
      api('/contacts/bulk-import', {method:'POST', body: JSON.stringify({rows:rows})}).then(function(res){
        var resultEl = body.querySelector('#imp-result');
        resultEl.innerHTML = '<div class="ok-msg">נוספו ' + res.added + ' אנשי קשר' + (res.failed ? ', ' + res.failed + ' נכשלו' : '') + '</div>' +
          res.results.filter(function(r){ return !r.ok; }).map(function(r){
            return '<div class="import-result bad">✖ ' + esc(r.name) + ' — ' + esc(r.error) + '</div>';
          }).join('');
        body.querySelector('#imp-text').value = '';
        loadShared();
      }).catch(function(e){ body.querySelector('#imp-result').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
    };
  }

  boot();
})();
</script>
</body>
</html>
