<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ערב שותפות — בית ספר חב"ד עפולה</title>
<style>
  :root{
    --navy:#1e293b; --navy-2:#0f172a; --gold:#c8952e; --gold-light:#f2c869;
    --cream:#fdf8ee; --card:#ffffff; --border:#ecdfc0; --text:#2a2015; --muted:#7a6f57;
    --radius:18px; --shadow:0 4px 18px rgba(120,90,20,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;
    background:radial-gradient(circle at 50% 0%, #fff8e6, var(--cream) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:24px 18px 40px}
  .hero-img{width:100%;border-radius:var(--radius);box-shadow:var(--shadow);display:block}
  .hero-details{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);
    margin-top:10px;padding:14px 18px;text-align:center;box-shadow:var(--shadow)}
  .hero-tagline{font-size:14px;font-weight:700;color:var(--gold-light);margin-bottom:6px}
  .hero-meta{font-size:13px;opacity:.92;line-height:1.6}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:24px 22px;width:100%;text-align:center;border:1px solid var(--border);margin-top:18px}
  .crest{font-size:32px;margin-bottom:6px}
  .brand{font-size:12.5px;letter-spacing:.5px;color:var(--gold);font-weight:700;text-transform:uppercase}
  .title{font-size:20px;font-weight:800;color:var(--navy);margin:8px 0 12px}
  .body-text{font-size:14.5px;line-height:1.9;color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <img src="/assets/save-the-date.jpg" alt="Save the Date" class="hero-img">
  <div class="hero-details">
    <div class="hero-tagline" id="ev-tagline">הזמן שלנו להתאחד, לצמוח ולפרוץ קדימה</div>
    <div class="hero-meta" id="ev-date">יום שלישי · כ"ו אלול · 8.9 · בשעה 20:30</div>
    <div class="hero-meta" id="ev-location">אולמי האושר, עפולה</div>
  </div>

  <div class="card">
    <div class="crest">🤝</div>
    <div class="brand">בית ספר חב"ד עפולה</div>
    <div class="title" id="ev-name">ערב שותפות</div>
    <div class="body-text">
      ערב מיוחד לכל הקהילה, לחיזוק ולצמיחה של מוסדות חב"ד עפולה.<br>
      מוזמנים שקיבלו הזמנה אישית מוזמנים לאשר הגעה דרך הקישור ששלחנו להם.<br>
      נשמח לראותכם ולשתף אתכם בהמשך הדרך! 💛
    </div>
  </div>
</div>
<script>
(function(){
  fetch('/api/campaign-settings').then(function(r){ return r.json(); }).then(function(s){
    function set(id, v){ if (v) document.getElementById(id).textContent = v; }
    set('ev-tagline', s.eventTagline);
    set('ev-date', s.eventDateText);
    set('ev-location', s.eventLocation);
    set('ev-name', s.eventName);
    if (s.eventName) document.title = s.eventName + ' — בית ספר חב"ד עפולה';
  }).catch(function(){});
})();
</script>
</body>
</html>
