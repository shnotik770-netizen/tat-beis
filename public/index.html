function renderManualStudentChips(filterText, cls){
  const box = document.getElementById('payStChips');
  if(!box) return;
  const q = (filterText||'').trim().toLowerCase();
  cls = cls || '';
  const prevSelected = pickedChips('payStChips');
  const hasQuery = q || cls;
  const list = D.students.filter(function(s){
    if(!hasQuery) return false; // במצב ברירת מחדל — לא מציגים רשימה עד שמקלידים/מסננים
    const mn = !q || (s.firstName+' '+s.lastName).toLowerCase().indexOf(q)>-1;
    const mc = !cls || classKey(s)===cls;
    return s.active==='כן' && mn && mc;
  });
  box.innerHTML = list.map(function(s){
    const on = prevSelected.indexOf(s.id)>-1 || s.id===window._payPresetStudentId;
    const debt = displayDebt(s.id);
    return '<span class="chip'+(on?' on':'')+'" onclick="tcPayStudent(this)" data-id="'+s.id+'" data-name="'+esc(s.firstName+' '+s.lastName)+'" data-cls="'+esc(classKey(s))+'">'+s.firstName+' '+s.lastName+' <small>('+(classKey(s)||'—')+')</small>'+(debt>0?' <small style="color:var(--red)">חוב ₪'+debt.toLocaleString()+'</small>':'')+'</span>';
  }).join('') || (hasQuery ? '<span class="t2">לא נמצאו תלמידים</span>' : '<span class="t2">הקלד שם לחיפוש...</span>');
  updPayAmts();
}
function tcPayStudent(el){ el.classList.toggle('on'); updPayAmts(); }
function pickedDemTitles(){
  return Array.prototype.slice.call(document.querySelectorAll('#payDemChips .chip.on')).map(function(el){ return el.getAttribute('data-title'); });
}
function syncPayFromDems(){
  const titles = pickedDemTitles();
  const sids = {};
  titles.forEach(function(title){
    D.demands.filter(function(d){return d.title===title;}).forEach(function(d){ d.studentIds.forEach(function(sid){ sids[sid]=1; }); });
  });
  const sidList = Object.keys(sids);
  if(!sidList.length) return;

  // אם עדיין לא נבחר הקשר משלם — פותחים ישירות בחירת תלמידים עם התלמידים הרלוונטיים לדרישה
  if(window._payMode==='none'){
    renderPresetPayStudents(sidList);
    return;
  }

  document.querySelectorAll('#payStChips .chip').forEach(function(c){
    if(sids[c.getAttribute('data-id')]) c.classList.add('on');
  });
  updPayAmts();
}
function filterPayStudents(name, cls){
  renderManualStudentChips(name, cls);
}
function updPayAmts(){
  const sids = pickedChips('payStChips');
  const prev = {};
  sids.forEach(function(sid){ const el=document.getElementById('pa_'+sid); if(el) prev[sid]=el.value; });
  const wrap = document.getElementById('payAmts');
  if(!sids.length){ wrap.innerHTML='<span class="t2">בחר תלמידים תחילה</span>'; updPayTot(); return; }
  wrap.innerHTML = sids.map(function(sid){
    const s = D.students.filter(function(x){return x.id===sid;})[0];
    return '<div class="p-row"><span style="flex:1">'+(s?s.firstName+' '+s.lastName:sid)+'</span>' +
      '<input type="number" placeholder="0" id="pa_'+sid+'" value="'+(prev[sid]||'')+'" oninput="updPayTot()" style="width:110px"></div>';
  }).join('');
  updPayTot();
}
function updPayTot(){
  const sids = pickedChips('payStChips');
  const tot = sids.reduce(function(s,sid){ const el=document.getElementById('pa_'+sid); return s+(el?parseFloat(el.value)||0:0); },0);
  const el = document.getElementById('payTotLbl'); if(el) el.textContent = '₪'+tot.toLocaleString();
}
// בודק אם למשפחה של התלמיד/ים שנבחרו כבר קיים תשלום רשום עם אותו סכום, אותה שיטת תשלום ואותו
// תאריך בדיוק — כדי לתפוס הזנה כפולה בטעות (ברישום ידני או בשיוך תשלום ממתין)
function findDuplicatePayment(studentIds, amount, method, dateDMY){
  if(!studentIds || !studentIds.length || !amount || !dateDMY) return null;
  const famIds = {};
  studentIds.forEach(function(sid){ clientFamilyIds(sid).forEach(function(fid){ famIds[fid]=1; }); });
  return D.payments.filter(function(p){
    return p.date===dateDMY && (p.method||'')===(method||'') && Math.abs(p.total-amount)<0.01 &&
      p.studentIds.some(function(sid){ return famIds[sid]; });
  })[0] || null;
}
// מציג אזהרה אם נמצא תשלום דומה קיים; מחזיר true להמשך שמירה, false אם המשתמש ביטל
function warnIfDuplicatePayment(studentIds, amount, method, dateDMY){
  const dup = findDuplicatePayment(studentIds, amount, method, dateDMY);
  if(!dup) return true;
  const names = dup.studentIds.map(function(sid){
    const s = D.students.filter(function(x){return x.id===sid;})[0];
    return s ? s.firstName+' '+s.lastName : '';
  }).filter(Boolean).join(', ');
  return confirm('⚠️ נמצא במשפחה תשלום דומה שכבר קיים:\n₪'+amount.toLocaleString()+' · '+method+' · '+dateDMY+
    (names?'\nעבור: '+names:'')+(dup.payer?' · שילם/ה '+dup.payer:'')+
    '\n\nייתכן שזו כפילות. להמשיך ולרשום בכל זאת?');
}
function savePay() {
  const sids = pickedChips('payStChips');
  if(!sids.length){ toast('חובה לבחור תלמיד','err'); return; }
  const amounts = {}; let hasAmt=false;
  sids.forEach(function(sid){
    const el = document.getElementById('pa_'+sid);
    const a = el?parseFloat(el.value)||0:0;
    if(a!==0){ amounts[sid]=a; hasAmt=true; } // סכום שלילי = זיכוי
  });
  if(!hasAmt){ toast('נא להזין סכום לפחות לתלמיד אחד','err'); return; }
  const method = getMethod('payMethodChips');
  const dateISO = v('p_date')||todayISO();
  const dateDMY = dmyFromISO(dateISO);
  const total = Object.keys(amounts).reduce(function(s,k){ return s+amounts[k]; },0);
  if(!warnIfDuplicatePayment(sids, total, method, dateDMY)) return;
  // ממפים את כותרות הדרישות שנבחרו לשורות הדרישה הספציפיות של התלמידים שבאמת נכללים בתשלום הזה
  const selTitles = pickedDemTitles();
  const demandIds = [];
  selTitles.forEach(function(title){
    D.demands.filter(function(d){ return d.title===title && d.studentIds.some(function(sid){return sids.indexOf(sid)>-1;}); })
      .forEach(function(d){ if(demandIds.indexOf(d.id)===-1) demandIds.push(d.id); });
  });
  const d = {studentIds:sids, demandIds: demandIds, amounts:amounts, payer:v('p_payer'), date: dateISO, method:method};
  google.script.run.withSuccessHandler(function(r){
    if(r&&!r.ok){ toast(r.err,'err'); return; }
    closeM(); toast('נרשם ✓','ok'); go('pay');
  }).addPayment(d);
}

// ── Debts ──
let debtSortCol = 'oldest', debtSortDir = 'asc', debtViewMode = 'child';
// חוב נטו ברמת המשפחה: סה"כ מה שנדרש מכל בני המשפחה מול סה"כ מה ששולם עבורם, לפני שמעגלים כל ילד
// בנפרד ל-0. כך תשלום שלא פוצל בדיוק בין אחים (למשל תשלום כללי אחד שמכסה כמה ילדים) לא משאיר
// "חוב" מדומה אצל מי מהם כל עוד המשפחה כולה שילמה את מה שנדרש ממנה.
// חוב זניח (עד ₪2, כולל) נחשב מסולק בכל המערכת — לא יוצר תג/רישום/התראה, כדי שהפרשי עיגול לא יטרידו.
function familyNetDebt(memberIds){
  let demanded = 0, paid = 0;
  memberIds.forEach(function(sid){
    D.demands.filter(function(d){ return d.studentIds.indexOf(sid)>-1; }).forEach(function(d){
      demanded += d.amount;
      paid += paidOnDem(sid, d.id);
    });
    paid += genCredit(sid);
  });
  const net = Math.round((demanded-paid)*100)/100;
  return net>2 ? net : 0;
}
function buildFamilyDebtGroups(list){
  const seen = {};
  const groups = [];
  list.forEach(function(s){
    if(seen[s.id]) return;
    const famIds = clientFamilyIds(s.id); // כל בני המשפחה — גם מי שאין לו כרגע חוב אישי
    famIds.forEach(function(fid){ seen[fid]=1; });
    const totalDebt = familyNetDebt(famIds);
    if(totalDebt<0.01) return; // נטו המשפחה מסולקת — לא מציגים שורה גם אם ילד בודד "נראה" בחוב

    const familyStudents = D.students.filter(function(x){ return famIds.indexOf(x.id)>-1; });
    const debtMembers = list.filter(function(x){ return famIds.indexOf(x.id)>-1; }); // לצורך דרישות פתוחות/תאריך ותיק
    const oldestSort = debtMembers.length ? Math.min.apply(null, debtMembers.map(function(m){return m.oldestSort;})) : 99999999;
    const oldestDate = debtMembers.length ? debtMembers.slice().sort(function(a,b){return a.oldestSort-b.oldestSort;})[0].oldestDate : '';
    const classes = familyStudents.map(function(m){return m.class;}).filter(function(v,i,a){return v && a.indexOf(v)===i;});
    const phone = familyStudents.map(function(m){return m.dadPhone||m.momPhone;}).filter(Boolean)[0];
    groups.push({
      id: familyStudents[0].id, isFamily:true, members: familyStudents,
      name: familyStudents.map(function(m){return m.firstName+' '+m.lastName;}).join(', '),
      class: classes.join(', '),
      debt: totalDebt,
      oldestSort: oldestSort, oldestDate: oldestDate, phone: phone,
      unpaidDemands: debtMembers.reduce(function(arr,m){return arr.concat(m.unpaidDemands||[]);},[]).filter(function(v,i,a){return a.indexOf(v)===i;})
    });
  });
  return groups;
}
function sortDebtList(list){
  const dir = debtSortDir==='asc' ? 1 : -1;
  return list.slice().sort(function(a,b){
    let av, bv;
    if(debtSortCol==='name'){ av=(a.name||(a.lastName+' '+a.firstName)); bv=(b.name||(b.lastName+' '+b.firstName)); return av.localeCompare(bv,'he')*dir; }
    if(debtSortCol==='class'){ av=a.class||''; bv=b.class||''; return av.localeCompare(bv,'he')*dir; }
    if(debtSortCol==='debt'){ return (a.debt-b.debt)*dir; }
    return (a.oldestSort-b.oldestSort)*dir; // oldest
  });
}
function sortIcon(col){ return debtSortCol===col ? (debtSortDir==='asc'?' ▲':' ▼') : ''; }
function setDebtSort(col){
  if(debtSortCol===col) debtSortDir = debtSortDir==='asc'?'desc':'asc';
  else { debtSortCol=col; debtSortDir = col==='debt'?'desc':'asc'; }
  renderDebts();
}
function setDebtView(mode){ debtViewMode=mode; renderDebts(); }

function renderDebts(filter, clsFilter) {
  if(filter===undefined) filter = (document.querySelector('#dbSearch')||{}).value || '';
  if(clsFilter===undefined) clsFilter = (document.getElementById('dbCls')||{}).value || '';

  const all = allDebts();
  let list = all.filter(function(s){
    const mn = !filter || (s.firstName+' '+s.lastName).toLowerCase().indexOf(filter.toLowerCase())>-1;
    const mc = !clsFilter || classKey(s)===clsFilter;
    return mn && mc;
  });
  const totDebt = Math.round(all.reduce(function(s,x){return s+x.debt;},0));

  const displayList = debtViewMode==='family' ? buildFamilyDebtGroups(list) : list;
  const sorted = sortDebtList(displayList);

  const rows = sorted.map(function(s){
    const phone = s.phone || s.dadPhone || s.momPhone;
    const demBadges = (s.unpaidDemands||[]).slice(0,4).map(function(t){return '<span class="badge rd" style="margin-left:2px">'+t+'</span>';}).join('');
    const name = s.isFamily ? s.name : (s.lastName+' '+s.firstName);
    const nameHtml = '<span style="cursor:pointer" onclick=\''+(s.isFamily?'openFamilyLedger':'openLedger')+'("'+s.id+'")\'>'+name+'</span>';
    const waMsg = s.isFamily ? null : buildWaMsg(s.id);
    return '<tr>' +
      '<td>'+nameHtml+(s.active!=='כן'&&!s.isFamily?' <span class="badge gy">לא פעיל</span>':'')+(s.isFamily?' <span class="badge am">👨‍👩‍👧 משפחה</span>':'')+'</td>' +
      '<td><span class="badge">'+(classKey(s)||'—')+'</span></td>' +
      '<td><strong style="color:var(--red)">₪'+s.debt.toLocaleString()+'</strong></td>' +
      '<td class="t2">'+(s.oldestDate||'—')+'</td>' +
      '<td>'+(demBadges||'<span class="t2">—</span>')+'</td>' +
      '<td>'+(s.isFamily?'<button class="btn b-h b-sm" onclick=\'openFamilyLedger("'+s.id+'")\'>👨‍👩‍👧</button>':'<button class="btn b-h b-sm" onclick=\'openLedger("'+s.id+'")\'>📒</button>')+
      (phone?' <a class="btn b-g b-sm" href="'+waLink(phone, waMsg||buildFamilyWaMsgQuick(s))+'" target="_blank">💬</a>':'')+'</td></tr>';
  }).join('');

  document.getElementById('pg').innerHTML =
    '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat rd"><div class="stat-l">תלמידים עם חוב</div><div class="stat-v">'+all.length+'</div></div>' +
      '<div class="stat rd"><div class="stat-l">סה"כ חוב</div><div class="stat-v">₪'+totDebt.toLocaleString()+'</div></div>' +
    '</div>' +
    '<div class="sr">' +
      '<input id="dbSearch" placeholder="חיפוש..." value="'+esc(filter)+'" oninput="renderDebtsResults()">' +
      '<select id="dbCls" onchange="renderDebtsResults()">'+clsOpts(clsFilter)+'</select>' +
      '<button class="btn '+(debtViewMode==='child'?'b-p':'b-h')+' b-sm" onclick="setDebtView(\'child\')">👤 לפי ילד</button>' +
      '<button class="btn '+(debtViewMode==='family'?'b-p':'b-h')+' b-sm" onclick="setDebtView(\'family\')">👨‍👩‍👧 לפי משפחות</button>' +
      '<button class="btn b-h b-sm" onclick="openExportDebt()">📤 ייצוא</button>' +
    '</div>' +
    '<div class="card" style="padding:0;overflow-x:auto"><table style="min-width:560px"><thead><tr>' +
      '<th style="cursor:pointer" onclick="setDebtSort(\'name\')">שם'+sortIcon('name')+'</th>' +
      '<th style="cursor:pointer" onclick="setDebtSort(\'class\')">כיתה'+sortIcon('class')+'</th>' +
      '<th style="cursor:pointer" onclick="setDebtSort(\'debt\')">חוב'+sortIcon('debt')+'</th>' +
      '<th style="cursor:pointer" onclick="setDebtSort(\'oldest\')">חוב ראשון'+sortIcon('oldest')+'</th>' +
      '<th>דרישות פתוחות</th><th></th></tr></thead>' +
    '<tbody id="dbTbody">'+(rows || '<tr><td colspan="6" class="empty">אין חובות פתוחים 🎉</td></tr>')+'</tbody></table></div>';
}
function renderDebtsResults(){
  const filter = document.getElementById('dbSearch').value;
  const clsFilter = document.getElementById('dbCls').value;
  const all = allDebts();
  let list = all.filter(function(s){
    const mn = !filter || (s.firstName+' '+s.lastName).toLowerCase().indexOf(filter.toLowerCase())>-1;
    const mc = !clsFilter || classKey(s)===clsFilter;
    return mn && mc;
  });
  const displayList = debtViewMode==='family' ? buildFamilyDebtGroups(list) : list;
  const sorted = sortDebtList(displayList);
  const rows = sorted.map(function(s){
    const phone = s.phone || s.dadPhone || s.momPhone;
    const demBadges = (s.unpaidDemands||[]).slice(0,4).map(function(t){return '<span class="badge rd" style="margin-left:2px">'+t+'</span>';}).join('');
    const name = s.isFamily ? s.name : (s.lastName+' '+s.firstName);
    const nameHtml = '<span style="cursor:pointer" onclick=\''+(s.isFamily?'openFamilyLedger':'openLedger')+'("'+s.id+'")\'>'+name+'</span>';
    const waMsg = s.isFamily ? null : buildWaMsg(s.id);
    return '<tr>' +
      '<td>'+nameHtml+(s.active!=='כן'&&!s.isFamily?' <span class="badge gy">לא פעיל</span>':'')+(s.isFamily?' <span class="badge am">👨‍👩‍👧 משפחה</span>':'')+'</td>' +
      '<td><span class="badge">'+(classKey(s)||'—')+'</span></td>' +
      '<td><strong style="color:var(--red)">₪'+s.debt.toLocaleString()+'</strong></td>' +
      '<td class="t2">'+(s.oldestDate||'—')+'</td>' +
      '<td>'+(demBadges||'<span class="t2">—</span>')+'</td>' +
      '<td>'+(s.isFamily?'<button class="btn b-h b-sm" onclick=\'openFamilyLedger("'+s.id+'")\'>👨‍👩‍👧</button>':'<button class="btn b-h b-sm" onclick=\'openLedger("'+s.id+'")\'>📒</button>')+
      (phone?' <a class="btn b-g b-sm" href="'+waLink(phone, waMsg||buildFamilyWaMsgQuick(s))+'" target="_blank">💬</a>':'')+'</td></tr>';
  }).join('');
  document.getElementById('dbTbody').innerHTML = rows || '<tr><td colspan="6" class="empty">אין חובות פתוחים 🎉</td></tr>';
}
function buildFamilyWaMsgQuick(familyGroup){
  const L = [];
  L.push('שלום, דוח חוב משפחתי עבור: '+familyGroup.name);
  L.push('');
  (familyGroup.unpaidDemands||[]).forEach(function(t){ L.push('- '+t); });
  L.push('');
  L.push('סה"כ חוב משפחתי: '+String.fromCharCode(8362)+familyGroup.debt.toLocaleString());
  return L.join(String.fromCharCode(10));
}
function openExportDebt(){
  const all = allDebts();
  if(!all.length){ toast('אין חובות לייצוא','ok'); return; }
  let listTxt = '📋 רשימת חובות\n' + '─'.repeat(30) + '\n';
  all.forEach(function(s){
    listTxt += '\n'+s.firstName+' '+s.lastName+' ('+(classKey(s)||'—')+') — ₪'+s.debt.toLocaleString();
  });
  const parMap = {};
  all.forEach(function(s){
    const full = D.students.filter(function(x){return x.id===s.id;})[0];
    if(!full) return;
    [[full.dadName, full.dadPhone],[full.momName, full.momPhone]].forEach(function(pair){
      const ph = (pair[1]||'').trim(); if(!ph) return;
      if(!parMap[ph]) parMap[ph] = {phone:ph, name:pair[0]||'', debt:0, kids:[]};
      if(parMap[ph].kids.indexOf(s.firstName+' '+s.lastName)===-1){ parMap[ph].kids.push(s.firstName+' '+s.lastName); parMap[ph].debt += s.debt; }
    });
  });
  let msgTxt = Object.keys(parMap).map(function(k){
    const p = parMap[k];
    return p.phone+'\nהורה יקר'+(p.name?' '+p.name:'')+',\nיש חוב בסך ₪'+Math.round(p.debt).toLocaleString()+' עבור: '+p.kids.join(', ')+'.\nאנא צור/י קשר עם המזכירות.';
  }).join('\n\n'+'─'.repeat(20)+'\n\n');
  if(!msgTxt) msgTxt = 'אין מספרי טלפון להורים.';
  openM('<div class="m-title">📤 ייצוא חובות</div>' +
    '<div class="fg"><label>רשימת חובות</label><textarea readonly style="height:150px;font-family:monospace;font-size:11px">'+esc(listTxt)+'</textarea></div>' +
    '<div class="fg"><label>הודעות להורים</label><textarea readonly style="height:150px;font-family:monospace;font-size:11px">'+esc(msgTxt)+'</textarea></div>' +
    '<div class="m-foot"><button class="btn b-h" onclick="closeM()">סגור</button></div>');
}

// ── Pending Payments Import/Assign ──
// חיפוש תלמיד לשיוך מהיר, לפי שם תלמיד או שם הורה. ההצעות מוצגות בתיבה מותאמת-אישית (לא datalist
// דפדפן) כדי שהמידע — שם ילד, הורים, חוב משפחתי, בסדר הזה — ישבור שורה ולא ייחתך.
function impMatchStudents(query){
  const q = (query||'').trim().toLowerCase();
  if(!q) return [];
  return D.students.filter(function(s){
    if(s.active!=='כן') return false;
    const nameMatch = (s.firstName+' '+s.lastName).toLowerCase().indexOf(q)>-1;
    const parentMatch = ((s.dadName||'')+' '+(s.momName||'')).toLowerCase().indexOf(q)>-1;
    return nameMatch || parentMatch;
  }).slice(0,8);
}
function impSuggestionRow(s){
  // מציגים רק את החוב הנטו ברמת המשפחה — לא סכום אישי גולמי, כדי לא להטעות כשהחלוקה בין אחים לא פוצלה בדיוק
  const famDebt = Math.round(familyNetDebt(clientFamilyIds(s.id)));
  const parents = [s.dadName, s.momName].filter(Boolean).join(', ');
  return '<div class="p-row" style="flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;padding:7px 8px" data-id="'+s.id+'" data-name="'+esc(s.firstName+' '+s.lastName)+'">' +
    '<div><strong>'+esc(s.firstName+' '+s.lastName)+'</strong> <span class="badge">'+(classKey(s)||'—')+'</span></div>' +
    (parents?'<div class="t2">הורים: '+esc(parents)+'</div>':'') +
    '<div class="t2">חוב משפחתי: ₪'+famDebt.toLocaleString()+'</div>' +
  '</div>';
}
// תיבת הצעות משותפת אחת, ממוקמת ב-position:fixed לפי מיקום שדה הקלט הפעיל — כך שהיא לא נחתכת
// גם כשהשדה נמצא בתוך טבלה עם גלילה אופקית (overflow-x) שהייתה חוסמת תיבה ממוקמת יחסית
function impSearchInput(inputEl, onSelect){
  let box = document.getElementById('impSuggestBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'impSuggestBox';
    box.className = 'card';
    box.style.cssText = 'display:none;position:fixed;z-index:200;overflow-y:auto;padding:4px;box-sizing:border-box;';
    document.body.appendChild(box);
  }
  inputEl.removeAttribute('data-selected-id');
  const matches = impMatchStudents(inputEl.value);
  if(!matches.length){ box.style.display='none'; return; }
  const rect = inputEl.getBoundingClientRect();
  box.style.width = '290px';
  box.style.left = Math.max(4, Math.min(rect.left, window.innerWidth-294))+'px';
  box.style.top = (rect.bottom+4)+'px';
  box.style.maxHeight = Math.max(120, Math.min(320, window.innerHeight-rect.bottom-16))+'px';
  box.innerHTML = matches.map(impSuggestionRow).join('');
  box.style.display = 'block';
  Array.prototype.slice.call(box.querySelectorAll('[data-id]')).forEach(function(el){
    el.onmousedown = function(){
      inputEl.value = el.getAttribute('data-name');
      inputEl.setAttribute('data-selected-id', el.getAttribute('data-id'));
      box.style.display = 'none';
      if(onSelect) onSelect(inputEl);
    };
  });
}
function impHideSuggest(){
  setTimeout(function(){ const box=document.getElementById('impSuggestBox'); if(box) box.style.display='none'; }, 150);
}
function renderImp() {
  let list = (D.pending || []).slice();
  list = tblApplySort('imp', list, function(col, p){
    if(col==='date') return dmyToSortable(p.date);
    if(col==='amount') return p.amount;
    return p[col]||'';
  });
  document.getElementById('tbAct').innerHTML =
    '<button class="btn b-p" onclick="openPasteImp()">📥 הדבק נתונים</button> ' +
    '<button class="btn b-h b-sm" id="impDelSelBtn" onclick="delSelectedImp()" disabled>🗑️ מחק נבחרים (0)</button>' +
    (list.length ? ' <button class="btn b-r b-sm" onclick="delAllImp()">🗑️ מחק הכל</button>' : '');
  const rows = list.map(function(p){
    return '<tr><td><input type="checkbox" class="impChk" data-id="'+p.id+'" onchange="impSelChanged()"></td>' +
      '<td>'+p.date+'</td><td>'+(p.payer||'—')+'</td><td>₪'+p.amount.toLocaleString()+'</td>' +
      '<td>'+(p.method?'<span class="badge">'+p.method+'</span>':'<span class="t2">—</span>')+'</td>' +
      '<td>'+(p.notes||'—')+'</td>' +
      '<td style="white-space:nowrap"><input type="text" data-pid="'+p.id+'" placeholder="הקלד שם תלמיד/הורה..." oninput="impSearchInput(this,impRowSelected)" onblur="impHideSuggest()" style="width:230px">' +
      ' <button class="btn b-h b-sm" title="שיוך מותאם (סכום חלקי / שיטה אחרת)" onclick=\'openAssignImp("'+p.id+'")\'>⚙️</button>' +
      ' <button class="btn b-r b-sm" title="מחק שורה זו" onclick=\'delSingleImp("'+p.id+'")\'>🗑️</button></td></tr>';
  }).join('');
  document.getElementById('pg').innerHTML =
    '<div class="info">הדבק נתוני תשלומים מאקסל (תאריך, שם משלם, סכום, שיטה, הערות). הקלידו שם תלמיד או הורה ובחרו מהרשימה כדי לשייך מיד את הסכום המלא — שורות שלא תשייכו ימשיכו לחכות כאן. אפשר לסמן שורות ולמחוק בודדות או הכל.</div>' +
    '<div class="card" style="padding:0;overflow-x:auto"><table style="min-width:560px"><thead><tr>'+
      '<th style="width:30px"><input type="checkbox" id="impSelAll" onchange="impToggleAll(this.checked)"></th>'+
      th('imp','date','תאריך','renderImp')+
      th('imp','payer','משלם','renderImp')+
      th('imp','amount','סכום','renderImp')+
      th('imp','method','שיטה','renderImp')+
      th('imp','notes','הערות','renderImp')+
      '<th></th></tr></thead>' +
    '<tbody>'+(rows || '<tr><td colspan="7" class="empty">אין תשלומים ממתינים</td></tr>')+'</tbody></table></div>';
}
function impSelectedIds(){
  return Array.prototype.slice.call(document.querySelectorAll('.impChk:checked')).map(function(el){return el.getAttribute('data-id');});
}
function impToggleAll(checked){
  document.querySelectorAll('.impChk').forEach(function(el){ el.checked = checked; });
  impSelChanged();
}
function impSelChanged(){
  const ids = impSelectedIds();
  const btn = document.getElementById('impDelSelBtn');
  if(btn){ btn.textContent = '🗑️ מחק נבחרים ('+ids.length+')'; btn.disabled = ids.length===0; }
  const total = document.querySelectorAll('.impChk').length;
  const all = document.getElementById('impSelAll');
  if(all) all.checked = total>0 && ids.length===total;
}
function delImpBatch(ids){
  let remaining = ids.length, failed = 0;
  ids.forEach(function(id){
    google.script.run.withSuccessHandler(function(r){
      if(!r || !r.ok) failed++;
      remaining--;
      if(remaining===0){
        toast(failed ? ('נמחקו '+(ids.length-failed)+' מתוך '+ids.length) : ('נמחקו '+ids.length+' שורות ✓'), failed?'err':'ok');
        go('imp');
      }
    }).deletePendingPayment(id);
  });
}
function delSelectedImp(){
  const ids = impSelectedIds();
  if(!ids.length) return;
  if(!confirm('למחוק '+ids.length+' שורות ממתינות לשיוך? פעולה זו אינה הפיכה.')) return;
  delImpBatch(ids);
}
function delAllImp(){
  const ids = (D.pending||[]).map(function(p){return p.id;});
  if(!ids.length){ toast('אין שורות למחוק','ok'); return; }
  if(!confirm('למחוק את כל '+ids.length+' השורות הממתינות לשיוך? פעולה זו אינה הפיכה.')) return;
  delImpBatch(ids);
}
function delSingleImp(pendingId){
  if(!confirm('למחוק שורה זו?')) return;
  google.script.run.withSuccessHandler(function(r){
    if(r&&!r.ok){ toast(r.err||'שגיאה','err'); return; }
    toast('נמחק','ok'); go('imp');
  }).deletePendingPayment(pendingId);
}
function impRowSelected(inputEl){
  quickAssignImp(inputEl.getAttribute('data-pid'), inputEl);
}
function quickAssignImp(pendingId, inputEl){
  const sid = inputEl.getAttribute('data-selected-id');
  if(!sid){ toast('יש לבחור תלמיד מתוך ההצעות המוצעות','err'); return; }
  const p = (D.pending||[]).filter(function(x){return x.id===pendingId;})[0];
  if(!p) return;
  if(!warnIfDuplicatePayment([sid], p.amount, p.method||'מזומן', p.date)) return;
  const amounts = {}; amounts[sid] = p.amount;
  inputEl.disabled = true;
  google.script.run.withSuccessHandler(function(r){
    if(r&&!r.ok){ toast(r.err,'err'); inputEl.disabled=false; return; }
    toast('שוייך ✓','ok'); go('imp');
  }).assignPendingPayment(pendingId, {studentIds:[sid], demandIds:[], amounts:amounts, method:p.method||'מזומן'});
}
function openPasteImp() {
  openM('<div class="m-title">📥 הדבקת תשלומים</div>' +
    '<div class="info">5 עמודות: תאריך, שם משלם, סכום, שיטה (מזומן/העברה בנקאית/אפליקציה/שיק/אשראי/אחר), הערות. שיטה והערות אופציונליים.</div>' +
    '<div class="fg"><textarea id="imp_paste" style="height:180px;font-family:monospace;font-size:12px"></textarea></div>' +
    '<div class="m-foot"><button class="btn b-h" onclick="closeM()">ביטול</button><button class="btn b-p" onclick="doPasteImp()">📥 ייבא</button></div>');
}
function doPasteImp(){
  const txt = v('imp_paste');
  if(!txt.trim()){ toast('לא הודבק כלום','err'); return; }
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){ toast(r.err,'err'); return; }
    go('imp');
    if(r.skipped>0){
      openImportReport('📋 דוח ייבוא תשלומים', r.added, r.skippedReasons||[]);
    } else {
      closeM(); toast('יובאו '+r.added+' שורות ✓','ok');
    }
  }).importPendingFromPaste(txt);
}
function openAssignImp(pendingId){
  const p = (D.pending||[]).filter(function(x){return x.id===pendingId;})[0];
  if(!p) return;
  openM('<div class="m-title">🔗 שיוך תשלום</div>' +
    '<div class="info">תאריך: '+p.date+' · משלם: '+(p.payer||'—')+' · סכום: ₪'+p.amount.toLocaleString()+'</div>' +
    '<div class="fg" style="position:relative"><label>תלמיד (הקלד שם תלמיד או הורה)</label><input id="ai_st" type="text" oninput="impSearchInput(this)" onblur="impHideSuggest()"></div>' +
    '<div class="fg"><label>סכום לתלמיד זה</label><input id="ai_amt" type="number" value="'+p.amount+'"></div>' +
    '<div class="fg"><label>אופן תשלום</label>'+methodChipsHTML('aiMethodChips', p.method||'מזומן')+'</div>' +
    '<div class="m-foot"><button class="btn b-h" onclick="closeM()">ביטול</button><button class="btn b-p" onclick=\'doAssignImp("'+pendingId+'")\'>✅ שייך</button></div>');
}
function doAssignImp(pendingId){
  const stEl = document.getElementById('ai_st');
  const sid = stEl ? stEl.getAttribute('data-selected-id') : null;
  const amt = parseFloat(v('ai_amt'))||0;
  if(!sid||!amt){ toast('נא לבחור תלמיד מהרשימה ולמלא סכום','err'); return; }
  const method = getMethod('aiMethodChips');
  const p = (D.pending||[]).filter(function(x){return x.id===pendingId;})[0];
  if(!warnIfDuplicatePayment([sid], amt, method, p?p.date:'')) return;
  const amounts = {}; amounts[sid]=amt;
  google.script.run.withSuccessHandler(function(r){
    if(r&&!r.ok){ toast(r.err,'err'); return; }
    closeM(); toast('שוייך ✓','ok'); go('imp');
  }).assignPendingPayment(pendingId, {studentIds:[sid], demandIds:[], amounts:amounts, method:method});
}

// ── Helpers ──
function v(id){ return document.getElementById(id).value; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openM(h){
  document.getElementById('modal').innerHTML=h;
  document.getElementById('ov').classList.add('open');
  window._modalDirty = false;
  const modalEl = document.getElementById('modal');
  modalEl.oninput = function(){ window._modalDirty = true; };
  modalEl.onchange = function(){ window._modalDirty = true; };
}
function closeM(){ document.getElementById('ov').classList.remove('open'); window._modalDirty = false; }
function closeMByBackdrop(){
  if(window._modalDirty && !confirm('יש נתונים שהוזנו ולא נשמרו. לצאת בכל זאת?')) return;
  closeM();
}
// דוח ייבוא כללי — מציג רשימה נפרדת של מה שהצליח מול מה שלא הצליח (ולמה), בסוף כל פעולת ייבוא/יצירה
function openImportReport(title, successCount, failItems){
  failItems = failItems || [];
  const list = failItems.map(function(t){
    return '<div class="p-row"><span style="color:var(--red)">✕</span><span style="flex:1">'+esc(t)+'</span></div>';
  }).join('');
  openM('<div class="m-title">'+title+'</div>' +
    '<div class="stats" style="margin-bottom:12px">' +
      '<div class="stat gr"><div class="stat-l">הצליחו</div><div class="stat-v">'+successCount+'</div></div>' +
      '<div class="stat rd"><div class="stat-l">לא הצליחו</div><div class="stat-v">'+failItems.length+'</div></div>' +
    '</div>' +
    (failItems.length ? '<div class="fg"><label>מה לא הצליח</label><div style="max-height:280px;overflow-y:auto;border:1px solid var(--bdr);border-radius:var(--r);padding:6px">'+list+'</div></div>' : '<div class="empty">הכל הצליח 🎉</div>') +
    '<div class="m-foot"><button class="btn b-p" onclick="closeM()">סגור</button></div>');
}
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  setTimeout(function(){t.classList.remove('show');},2500);
}
